<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calc Console · Mechanical</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --panel2:#fafbfc; --ink:#0f1419; --ink2:#39424e;
    --mute:#727d8c; --line:#e2e6eb; --line2:#eef1f4;
    --accent:#4f46e5; --accent2:#7c3aed; --accent-soft:#eeecfd;
    --good:#0c7a6d; --good-soft:#e4f2f0; --warn:#b45309; --warn-soft:#fdf2e3; --bad:#b42318; --bad-soft:#fdecea;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,system-ui,sans-serif;
    --rail:250px;
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --panel:#151a21; --panel2:#1b212a; --ink:#e8ecf1; --ink2:#b9c2cd;
    --mute:#7f8b9a; --line:#252c37; --line2:#1e242d;
    --accent:#8b85ff; --accent2:#b48bff; --accent-soft:#211f3a;
    --good:#4fd1bd; --good-soft:#10302c; --warn:#e0a458; --warn-soft:#33260f; --bad:#f27c72; --bad-soft:#3a1a17;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}

  /* ---------- shell ---------- */
  .app{display:flex; flex-direction:column; height:100vh; overflow:hidden}
  header.bar{
    flex:0 0 auto; display:flex; align-items:center; gap:14px;
    padding:0 16px; height:52px; background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:0 0 auto}
  .brand .dot{width:9px;height:9px;border-radius:2px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .brand b{font-size:14px;font-weight:700;letter-spacing:-.2px}
  .brand span{font-size:12px;color:var(--mute)}
  .searchwrap{flex:1 1 auto; max-width:460px; position:relative}
  #q{
    width:100%; padding:8px 74px 8px 32px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel2); font-size:13.5px;
    outline:none; transition:border-color .12s, box-shadow .12s;
  }
  #q:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--panel)}
  .searchwrap .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:13px;pointer-events:none}
  .searchwrap .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;display:flex;gap:3px}
  kbd{
    font-family:var(--mono); font-size:10px; color:var(--mute);
    border:1px solid var(--line); border-bottom-width:2px; border-radius:4px;
    padding:1px 5px; background:var(--panel);
  }
  .spacer{flex:1 1 auto}
  .iconbtn{
    background:transparent;border:1px solid var(--line);border-radius:7px;
    padding:5px 10px;font-size:12px;color:var(--ink2);cursor:pointer;transition:.12s;
  }
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}

  .body{flex:1 1 auto; display:flex; min-height:0}

  /* ---------- rail ---------- */
  nav.rail{
    flex:0 0 var(--rail); width:var(--rail); overflow-y:auto; overflow-x:hidden;
    background:var(--panel); border-right:1px solid var(--line); padding:10px 0 40px;
  }
  .grouphead{
    font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
    color:var(--mute); padding:14px 16px 6px;
  }
  .item{
    display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
    padding:6px 16px; border:0; background:transparent; cursor:pointer;
    border-left:2px solid transparent; color:var(--ink2); font-size:13px; line-height:1.35;
  }
  .item:hover{background:var(--panel2); color:var(--ink)}
  .item.sel{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent); font-weight:600}
  .item .n{font-family:var(--mono); font-size:10px; color:var(--mute); flex:0 0 auto}
  .item.sel .n{color:var(--accent)}
  .empty{padding:24px 16px; color:var(--mute); font-size:12.5px}

  /* ---------- work area ---------- */
  main.work{flex:1 1 auto; overflow-y:auto; padding:22px 26px 80px; min-width:0}
  .wrap{max-width:1080px; margin:0 auto}
  .title{font-size:23px; font-weight:700; letter-spacing:-.4px; margin:0}
  .sub{color:var(--mute); font-size:13px; margin:3px 0 0}
  .eq{
    display:inline-block; margin-top:12px; font-family:var(--mono); font-size:12.5px;
    color:var(--ink2); background:var(--panel2); border:1px solid var(--line);
    border-radius:7px; padding:6px 11px; white-space:pre-wrap;
  }
  .cols{display:grid; grid-template-columns:minmax(300px,1fr) minmax(300px,1.05fr); gap:18px; margin-top:20px; align-items:start}
  @media(max-width:900px){ .cols{grid-template-columns:1fr} }
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .card > h3{
    margin:0; padding:10px 16px; font-size:10.5px; font-weight:700;
    letter-spacing:1.4px; text-transform:uppercase; color:var(--mute);
    border-bottom:1px solid var(--line2); background:var(--panel2);
  }
  .fields{padding:6px 16px 14px}
  .f{display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line2)}
  .f:last-child{border-bottom:0}
  .f label{flex:1 1 auto; font-size:13px; color:var(--ink2); min-width:0}
  .f label small{display:block; color:var(--mute); font-size:11px; line-height:1.3}
  .f .ctl{flex:0 0 auto; display:flex; align-items:center; gap:6px}
  .f input[type=number], .f select{
    width:118px; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
    background:var(--panel2); font-family:var(--mono); font-size:13px; text-align:right; outline:none;
  }
  .f select{width:auto; max-width:230px; text-align:left; font-family:var(--sans); font-size:12.5px}
  .f input[type=number]:focus, .f select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--panel)}
  .f .unit{font-family:var(--mono); font-size:11.5px; color:var(--mute); width:44px}
  .f.wide{display:block}
  .f.wide label{margin-bottom:6px; display:block}
  .f textarea{
    width:100%; min-height:112px; resize:vertical; padding:9px 10px;
    border:1px solid var(--line); border-radius:7px; background:var(--panel2);
    font-family:var(--mono); font-size:12.5px; line-height:1.7; outline:none;
  }
  .f textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--panel)}
  .segs{display:flex; flex-wrap:wrap; gap:5px}
  .seg{
    padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:var(--panel2);
    font-size:12px; cursor:pointer; color:var(--ink2); transition:.12s;
  }
  .seg:hover{border-color:var(--accent)}
  .seg.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}

  /* results */
  .hero{padding:18px 16px 16px; border-bottom:1px solid var(--line2)}
  .hero .lab{font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--mute); font-weight:700}
  .hero .val{font-family:var(--mono); font-size:38px; font-weight:600; letter-spacing:-1.2px; line-height:1.15; margin-top:4px; word-break:break-word}
  .hero .val u{text-decoration:none; font-size:17px; color:var(--mute); margin-left:6px; font-weight:400}
  .rows{padding:4px 16px 12px}
  .r{display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid var(--line2); font-size:13px}
  .r:last-child{border-bottom:0}
  .r .k{flex:1 1 auto; color:var(--ink2)}
  .r .v{font-family:var(--mono); font-weight:600; text-align:right; white-space:nowrap}
  .r .u{font-family:var(--mono); font-size:11px; color:var(--mute); width:44px; text-align:left}
  .r.head{font-size:10px; letter-spacing:1.1px; text-transform:uppercase; color:var(--mute); font-weight:700; border-bottom-color:var(--line); padding-top:14px}
  .r.head .v,.r.head .u{font-weight:700}
  .note{margin:0; padding:12px 16px; font-size:12.5px; line-height:1.55; border-top:1px solid var(--line2); background:var(--panel2); color:var(--ink2)}
  .note.good{background:var(--good-soft); color:var(--good)}
  .note.warn{background:var(--warn-soft); color:var(--warn)}
  .note.bad{background:var(--bad-soft); color:var(--bad)}
  .pill{display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.6px;
    padding:2px 7px; border-radius:5px; background:var(--accent-soft); color:var(--accent); margin-left:8px; vertical-align:middle}
  .foot{display:flex; gap:8px; align-items:center; margin-top:16px; flex-wrap:wrap}
  .hint{color:var(--mute); font-size:11.5px; font-family:var(--mono)}
  table.ref{width:100%; border-collapse:collapse; font-size:12.5px}
  table.ref th{text-align:left; font-size:10px; letter-spacing:1.1px; text-transform:uppercase; color:var(--mute); padding:8px 16px; border-bottom:1px solid var(--line)}
  table.ref td{padding:7px 16px; border-bottom:1px solid var(--line2); vertical-align:top}
  table.ref tr:last-child td{border-bottom:0}
  table.ref td.m{font-family:var(--mono)}
  ul.rules{margin:0; padding:8px 16px 14px 32px}
  ul.rules li{padding:5px 0; font-size:13px; color:var(--ink2)}
  ul.rules li b{color:var(--ink); font-weight:600}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px; border:3px solid var(--panel)}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="brand" href="../index.html"><span class="dot"></span><b>Calc Console</b><span>· Mechanical</span></a>
    <div class="searchwrap">
      <span class="mag">⌕</span>
      <input id="q" type="text" placeholder="Search — boring, DFM, bolt torque, L10…" autocomplete="off" spellcheck="false" />
      <span class="kbd"><kbd>/</kbd><kbd>↑↓</kbd><kbd>⏎</kbd></span>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="theme">◐ Theme</button>
  </header>
  <div class="body">
    <nav class="rail" id="rail"></nav>
    <main class="work"><div class="wrap" id="work"></div></main>
  </div>
</div>

<script>
"use strict";
/* ============================ shared data ============================ */
const MATS = [
  {name:'CRS 1008/1010',      cat:'Carbon steel', shear:310, tensile:365},
  {name:'HSLA Gr. 50',        cat:'Carbon steel', shear:430, tensile:480},
  {name:'Stainless 304',      cat:'Stainless',    shear:520, tensile:620},
  {name:'Stainless 430',      cat:'Stainless',    shear:460, tensile:515},
  {name:'Aluminium 5052-H32', cat:'Aluminium',    shear:138, tensile:228},
  {name:'Aluminium 6061-T6',  cat:'Aluminium',    shear:207, tensile:310},
  {name:'Brass C260 ½-hard',  cat:'Copper alloy', shear:250, tensile:415},
  {name:'Copper C110',        cat:'Copper alloy', shear:165, tensile:220}
];
const MATOPT = MATS.map((m,i)=>[i, m.name+' — τ '+m.shear+' MPa']);
const MATOPT_T = MATS.map((m,i)=>[i, m.name+' — UTS '+m.tensile+' MPa']);

const CUT = [
  ['Mild steel · HSS — Vc 30',        30,  2.5],
  ['Mild steel · carbide — Vc 150',   150, 2.5],
  ['Alloy steel · carbide — Vc 120',  120, 2.8],
  ['Stainless · carbide — Vc 100',    100, 3.0],
  ['Cast iron · carbide — Vc 120',    120, 1.5],
  ['Aluminium · HSS — Vc 90',         90,  0.9],
  ['Aluminium · carbide — Vc 300',    300, 0.9],
  ['Brass/bronze · carbide — Vc 200', 200, 1.2]
];
const FITS = [
  {hole:'H9', shaft:'d9', hg:40, sg:40, dev:'d', kind:'clearance',    use:'Free running — loose bearings, high temperature or dirty environments.'},
  {hole:'H9', shaft:'e9', hg:40, sg:40, dev:'e', kind:'clearance',    use:'Easy running — widely spaced bearings, plummer blocks.'},
  {hole:'H8', shaft:'f7', hg:25, sg:16, dev:'f', kind:'clearance',    use:'Close running — accurate machine-tool spindles and shafts.'},
  {hole:'H7', shaft:'g6', hg:16, sg:10, dev:'g', kind:'clearance',    use:'Sliding — precise location, parts slide and turn freely.'},
  {hole:'H7', shaft:'h6', hg:16, sg:10, dev:'h', kind:'clearance',    use:'Locational clearance — snug assembly, freely dismountable.'},
  {hole:'H7', shaft:'k6', hg:16, sg:10, dev:'k', kind:'transition',   use:'Transition — accurate location, light press with keying.'},
  {hole:'H7', shaft:'n6', hg:16, sg:10, dev:'n', kind:'transition',   use:'Transition/press — rigid location, assembly by press.'},
  {hole:'H7', shaft:'p6', hg:16, sg:10, dev:'p', kind:'interference', use:'Light press — permanent location of gears and bushings.'},
  {hole:'H7', shaft:'s6', hg:16, sg:10, dev:'s', kind:'interference', use:'Heavy press / shrink — permanent hubs, no keying needed.'}
];
const BOLTS = [
  ['M6 × 1.0',6,20.1],['M8 × 1.25',8,36.6],['M10 × 1.5',10,58.0],['M12 × 1.75',12,84.3],
  ['M16 × 2.0',16,157],['M20 × 2.5',20,245],['M24 × 3.0',24,353]
];
const BRGS = [
  ['6204 — deep groove ball',20,13.5,0],['6205 — deep groove ball',25,14.8,0],['6206 — deep groove ball',30,20.3,0],
  ['6207 — deep groove ball',35,27.0,0],['6208 — deep groove ball',40,32.5,0],['6210 — deep groove ball',50,35.1,0],
  ['6306 — deep groove ball',30,29.6,0],['6308 — deep groove ball',40,42.3,0],['6310 — deep groove ball',50,61.8,0],
  ['7206 B — angular contact',30,29.1,0],['7208 B — angular contact',40,44.9,0],['7310 B — angular contact',50,76.1,0],
  ['NU 206 — cylindrical roller',30,44.0,1],['NU 208 — cylindrical roller',40,62.0,1],['NU 310 — cylindrical roller',50,110.0,1],
  ['30206 — taper roller',30,47.5,1],['30208 — taper roller',40,70.4,1],['32210 — taper roller',50,106.0,1],
  ['1206 — self-aligning ball',30,15.6,0],['1208 — self-aligning ball',40,19.0,0],
  ['22208 E — spherical roller',40,106.0,1],['22210 E — spherical roller',50,122.0,1]
];
const KEYS = [[12,17,'5 × 5'],[17,22,'6 × 6'],[22,30,'8 × 7'],[30,38,'10 × 8'],[38,44,'12 × 8'],[44,50,'14 × 9'],
  [50,58,'16 × 10'],[58,65,'18 × 11'],[65,75,'20 × 12'],[75,85,'22 × 14'],[85,95,'25 × 14'],[95,110,'28 × 16']];
const SHAFT_STD = [20,25,30,35,40,45,50,55,60,70,80,90,100,110];
const SVC = {steady:[1.5,1.0], light:[2.0,1.5], heavy:[2.5,2.0]};
const BEAMS = {
  ssP:  {pt:1, txt:'Simply supported · centre point load', f:'Mmax = PL/4    δ = PL³/48EI', c:(P,L,EI)=>({V:P/2, M:P*L/4,  d:P*L**3/(48*EI)})},
  ssU:  {pt:0, txt:'Simply supported · UDL',              f:'Mmax = wL²/8   δ = 5wL⁴/384EI', c:(w,L,EI)=>({V:w*L/2, M:w*L*L/8, d:5*w*L**4/(384*EI)})},
  cantP:{pt:1, txt:'Cantilever · end point load',         f:'Mmax = PL      δ = PL³/3EI',   c:(P,L,EI)=>({V:P, M:P*L, d:P*L**3/(3*EI)})},
  cantU:{pt:0, txt:'Cantilever · UDL',                    f:'Mmax = wL²/2   δ = wL⁴/8EI',   c:(w,L,EI)=>({V:w*L, M:w*L*L/2, d:w*L**4/(8*EI)})},
  ffP:  {pt:1, txt:'Fixed–fixed · centre point load',     f:'Mmax = PL/8    δ = PL³/192EI', c:(P,L,EI)=>({V:P/2, M:P*L/8, d:P*L**3/(192*EI)})}
};

/* ============================ helpers ============================ */
const F = (n,d) => (isFinite(n) ? n : 0).toLocaleString('en-US',{minimumFractionDigits:d??0, maximumFractionDigits:d??0});
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const N   = (l,v,u,d) => ({label:l, value:v, unit:u, d:d});
const S   = (l,v,u)   => ({label:l, value:String(v), unit:u||''});
const HEAD= (l)       => ({label:l, head:true});

/* ============================ calculators ============================ */
const CALCS = [

/* ------------------------------ press & sheet metal ------------------------------ */
{
  id:'press', group:'Press & sheet metal', name:'Blanking / press force',
  tags:'press force blank punch shear tonnage cut perimeter',
  eq:'F = L · t · τ        press size ≈ 1.3 F',
  sub:'Punch or blank tonnage from cut length, stock thickness and shear strength.',
  inputs:[
    {k:'L', label:'Total cut length', hint:'Perimeter of the blank plus every internal cut-out', unit:'mm', v:220, step:5},
    {k:'t', label:'Stock thickness', unit:'mm', v:1.5, step:0.1},
    {k:'m', label:'Material', type:'sel', opts:MATOPT, v:0}
  ],
  run(v){
    const mat = MATS[v.m], Nn = v.L*v.t*mat.shear;
    return {
      hero:N('Blanking force', Nn/1000, 'kN', 1),
      rows:[
        N('Metric tons', Nn/9807, 't', 2),
        N('Press capacity, +30 %', Nn/9807*1.3, 't', 2),
        N('Stripping force ≈ 10 %', Nn/1000*0.1, 'kN', 1),
        HEAD('Material'),
        S('Grade', mat.name),
        N('Shear strength τ', mat.shear, 'MPa', 0),
        N('Cut area', v.L*v.t, 'mm²', 0)
      ],
      note:['Size the press on the +30 % figure, not the bare force — snap-through and misfeed spikes eat the difference.','']
    };
  }
},
{
  id:'bend', group:'Press & sheet metal', name:'Bend allowance & deduction',
  tags:'bend allowance deduction flat pattern k factor neutral axis springback',
  eq:'BA = θ · (R + K·t)        BD = 2(R+t)·tan(θ/2) − BA',
  sub:'Flat-pattern length for an air or bottom bend.',
  inputs:[
    {k:'t', label:'Stock thickness', unit:'mm', v:1.5, step:0.1},
    {k:'R', label:'Inside bend radius', unit:'mm', v:1.5, step:0.5},
    {k:'a', label:'Bend angle θ', hint:'Angle turned through, not the included angle', unit:'°', v:90, step:5},
    {k:'kmode', label:'K-factor', type:'seg', opts:[['auto','Auto (R<2t → 0.33)'],['33','0.33'],['40','0.40'],['44','0.44'],['50','0.50']], v:'auto'}
  ],
  run(v){
    const K = v.kmode==='auto' ? (v.R < 2*v.t ? 0.33 : 0.5) : parseFloat(v.kmode)/100;
    const th = v.a*Math.PI/180;
    const BA = th*(v.R + K*v.t);
    const OSSB = (v.R+v.t)*Math.tan(th/2);
    const BD = 2*OSSB - BA;
    const bad = v.R < v.t;
    return {
      hero:N('Bend allowance', BA, 'mm', 2),
      rows:[
        N('Bend deduction', BD, 'mm', 2),
        N('Outside setback', OSSB, 'mm', 2),
        N('K-factor used', K, '', 2),
        N('Neutral-axis offset', K*v.t, 'mm', 2),
        HEAD('Checks'),
        N('R / t ratio', v.R/v.t, '', 2),
        N('Min flange (4t)', 4*v.t, 'mm', 1)
      ],
      note: bad
        ? ['Inside radius below 1 × t — the outer fibre will crack in most steels. Open the radius to 1–2 × t.','bad']
        : v.R > 8*v.t
          ? ['Very generous radius — springback dominates; expect to over-bend several degrees to hold θ.','warn']
          : ['Radius sits in the safe 1–8 × t band. Flat length = sum of flanges (outside) − bend deduction.','good']
    };
  }
},
{
  id:'dfm', group:'Press & sheet metal', name:'Sheet-metal DFM check',
  tags:'dfm design for manufacturing minimum feature hole edge web notch tab relief rules',
  eq:'every minimum scaled from stock thickness t',
  sub:'Minimum punchable features for one stock thickness — the numbers to put on the drawing.',
  inputs:[
    {k:'t', label:'Stock thickness', unit:'mm', v:1.5, step:0.1},
    {k:'ss', label:'Stainless', hint:'Stainless needs a larger minimum hole', type:'seg', opts:[['0','No'],['1','Yes']], v:'0'}
  ],
  run(v){
    const t=v.t, ss=v.ss==='1';
    return {
      hero:N('Min punched hole Ø', (ss?1.5:1.0)*t, 'mm', 2),
      rows:[
        HEAD('Spacing'),
        N('Hole to edge (1.5 t)', 1.5*t, 'mm', 2),
        N('Hole to hole (2 t)',   2*t,   'mm', 2),
        N('Hole to bend tangent (2.5 t + R)', 2.5*t, 'mm + R', 2),
        HEAD('Forming'),
        N('Min inside bend radius (1 t)', t, 'mm', 2),
        N('Min flange width (4 t)', 4*t, 'mm', 2),
        N('Bend relief width (1 t)', t, 'mm', 2),
        N('Bend relief depth (R + t)', t, 'mm + R', 2),
        HEAD('Cut features'),
        N('Min notch width (1.5 t)', 1.5*t, 'mm', 2),
        N('Max notch depth (5 × width)', 7.5*t, 'mm', 2),
        N('Min tab width (2 t)', 2*t, 'mm', 2),
        S('Grain direction', 'Bend axis ⊥ rolling direction'),
        S('Burr side', 'Call out on the drawing')
      ],
      note:['Punching below the minimum hole Ø snaps punches — go to drilling or laser instead of shrinking the punch.','']
    };
  }
},
{

{
  id:'fits', group:'Fits & tolerances', name:'ISO fits & limits',
  tags:'fit limit tolerance iso h7 g6 clearance interference transition shaft hole bore it grade',
  eq:'i = 0.45·∛D + 0.001·D        IT = n · i',
  sub:'Hole and shaft deviations, and the clearance or interference they produce.',
  inputs:[
    {k:'D', label:'Nominal diameter', unit:'mm', v:40, step:5},
    {k:'i', label:'Fit', type:'sel', opts:FITS.map((f,i)=>[i, f.hole+'/'+f.shaft+' — '+f.kind]), v:3}
  ],
  run(v){
    const D=Math.max(1,v.D), f=FITS[v.i];
    const i = 0.45*Math.cbrt(D) + 0.001*D;
    const IT = {10:10*i, 16:16*i, 25:25*i, 40:40*i};
    const holeES = IT[f.hg], sIT = IT[f.sg];
    const devs = {d:-16*D**0.44, e:-11*D**0.41, f:-5.5*D**0.41, g:-2.5*D**0.34, h:0,
                  k:0.6*Math.cbrt(D), n:5*D**0.34, p:5.6*D**0.41, s:IT[16] + 0.4*D};
    const fd = devs[f.dev];
    let es, ei;
    if ('defgh'.includes(f.dev)){ es = fd; ei = fd - sIT; } else { ei = fd; es = fd + sIT; }
    const cMax = holeES - ei, cMin = -es;
    const mm = x => F(D + x/1000, 3);
    const sgn = x => (x>=0?'+':'−')+F(Math.abs(x),0);
    return {
      hero:S('Ø'+F(D,0)+' '+f.hole+'/'+f.shaft, ''),
      pill:f.kind.toUpperCase(),
      rows:[
        HEAD('Hole '+f.hole),
        S('Upper limit', mm(holeES)+' mm'),
        S('Lower limit', mm(0)+' mm'),
        S('ES / EI', sgn(holeES)+' / +0 µm'),
        HEAD('Shaft '+f.shaft),
        S('Upper limit', mm(es)+' mm'),
        S('Lower limit', mm(ei)+' mm'),
        S('es / ei', sgn(es)+' / '+sgn(ei)+' µm'),
        HEAD('Resulting fit'),
        N('Max clearance', cMax, 'µm', 0),
        N('Min clearance', cMin, 'µm', 0),
        N('Tolerance grade unit i', i, 'µm', 2)
      ],
      note:[f.use + '  ' + (cMin >= 0
        ? 'Guaranteed gap of '+F(cMin,0)+'–'+F(cMax,0)+' µm across the band.'
        : cMax <= 0
          ? F(-cMax,0)+'–'+F(-cMin,0)+' µm interference — assemble by press or thermal shrink.'
          : 'May assemble with up to '+F(cMax,0)+' µm clearance or '+F(-cMin,0)+' µm interference.'), '']
    };
  }
},
{
  id:'stack', group:'Fits & tolerances', name:'Tolerance stack-up',
  tags:'tolerance stack up worst case rss chain gap assembly statistical',
  eq:'worst case = Σ|tol|        RSS = √(Σ tol²)',
  sub:'One dimension per line. Dimensions that open the gap are positive, those that close it are negative.',
  inputs:[

     v:'Housing bore depth, 50, 0.15\nBearing width, -12, 0.06\nSpacer, -25, 0.10\nGear hub, -12.5, 0.08'}
  ],
  run(v){
    const lines = String(v.rows).split('\n').map(s=>s.trim()).filter(Boolean);
    const rows = lines.map(l=>{
      const p = l.split(',');
      return {name:(p[0]||'dim').trim(), nom:parseFloat(p[1])||0, tol:Math.abs(parseFloat(p[2])||0)};
    });
    const nom = rows.reduce((a,r)=>a+r.nom, 0);
    const wc  = rows.reduce((a,r)=>a+r.tol, 0);
    const rss = Math.sqrt(rows.reduce((a,r)=>a+r.tol*r.tol, 0));
    const detail = rows.map(r=>S(r.name, (r.nom>=0?'+':'−')+F(Math.abs(r.nom),3)+'  ± '+F(r.tol,3)));
    return {
      hero:N('Nominal gap', nom, 'mm', 3),

        N('Gap min', nom-rss, 'mm', 3),
        N('± band', rss, 'mm', 3),

      ],

{

    {k:'sec',label:'Section', type:'seg', opts:[['rect','Rectangle'],['circ','Round'],['cust','Custom I']], v:'rect'},
    {k:'b',  label:'Width b', unit:'mm', v:40, step:5, when:v=>v.sec==='rect'},
    {k:'h',  label:'Depth h', unit:'mm', v:60, step:5, when:v=>v.sec==='rect'},
    {k:'d',  label:'Diameter d', unit:'mm', v:50, step:5, when:v=>v.sec==='circ'},
    {k:'I',  label:'Second moment I', unit:'cm⁴', v:80, step:10, when:v=>v.sec==='cust'},
    {k:'c',  label:'Extreme fibre c', unit:'mm', v:30, step:5, when:v=>v.sec==='cust'}
  ],
  run(v){
    const bc = BEAMS[v.cs], L = Math.max(1, v.L), E = v.E*1000;
    let I, c;
    if (v.sec==='rect'){ I = v.b*v.h**3/12; c = v.h/2; }
    else if (v.sec==='circ'){ I = Math.PI*v.d**4/64; c = v.d/2; }
    else { I = v.I*1e4; c = v.c; }
    const load = bc.pt ? v.P*1000 : v.P;           // N, or N/mm for UDL
    const r = bc.c(load, L, E*I);
    const sigma = r.M*c/I;
    const ratio = r.d > 0 ? Math.round(L/r.d) : 0;
    return {
      hero:N('Max deflection', r.d, 'mm', 3),
      pill:'L/'+ratio,
      rows:[
        N('Max bending moment', r.M/1000, 'N·m', 1),
        N('Max shear', r.V/1000, 'kN', 2),
        N('Bending stress σ', sigma, 'MPa', 1),
        HEAD('Section'),
        N('Second moment I', I/1e4, 'cm⁴', 2),

        N('σ at FS 2 on 250 MPa yield', 125, 'MPa', 0),
        S('Formula', bc.f)
      ],
      note: ratio && ratio < 250

{
  id:'buck', group:'Structures', name:'Column buckling',
  tags:'column buckling euler johnson slenderness critical load strut pillar',
  eq:'λ = K·L / r        Euler Pcr = π²EA / λ²',
  sub:'Critical load with automatic switching between the Euler and Johnson regimes.',
  inputs:[
    {k:'L', label:'Length L', unit:'mm', v:1200, step:50},
    {k:'end', label:'End fixity', type:'sel', opts:[['pp','Pinned–pinned  K = 1.0'],['ff','Fixed–fixed  K = 0.5'],['fp','Fixed–pinned  K = 0.7'],['fr','Fixed–free  K = 2.0']], v:'pp'},
    {k:'sec', label:'Section', type:'seg', opts:[['circ','Round'],['rect','Rectangle']], v:'circ'},
    {k:'d', label:'Diameter d', unit:'mm', v:30, step:2, when:v=>v.sec==='circ'},
    {k:'b', label:'Width b', unit:'mm', v:40, step:5, when:v=>v.sec==='rect'},
    {k:'h', label:'Depth h', unit:'mm', v:25, step:5, when:v=>v.sec==='rect'},
    {k:'E', label:'Young’s modulus', unit:'GPa', v:200, step:10},
    {k:'sy',label:'Yield strength', unit:'MPa', v:250, step:25},
    {k:'fs',label:'Safety factor', unit:'×', v:3, step:0.5}
  ],
  run(v){
    const K = {pp:1.0, ff:0.5, fp:0.7, fr:2.0}[v.end];
    const L = Math.max(10, v.L), E = v.E*1000, sy = Math.max(1, v.sy);
    let A, I;
    if (v.sec==='circ'){ const d=Math.max(1,v.d); A=Math.PI*d*d/4; I=Math.PI*d**4/64; }
    else { const b=Math.max(1,v.b), h=Math.max(1,v.h); const t1=Math.min(b,h), t2=Math.max(b,h); A=b*h; I=t2*t1**3/12; }
    const r = Math.sqrt(I/A);
    const lam = K*L/r;
    const lam1 = Math.sqrt(2*Math.PI**2*E/sy);
    const euler = lam >= lam1;
    const Pcr = euler ? Math.PI**2*E*A/(lam*lam) : A*sy*(1 - sy*lam*lam/(4*Math.PI**2*E));
    return {
      hero:N('Safe load', Pcr/1000/Math.max(0.1,v.fs), 'kN', 1),
      pill: euler ? 'EULER' : 'JOHNSON',
      rows:[
        N('Critical load Pcr', Pcr/1000, 'kN', 1),
        N('Slenderness λ', lam, '', 0),
        N('Transition λ₁', lam1, '', 0),
        N('Radius of gyration r', r, 'mm', 2),
        N('Effective length K·L', K*L, 'mm', 0),
        HEAD('Section'),
        N('Area A', A, 'mm²', 0),
        N('Least I', I/1e4, 'cm⁴', 3),
        N('Squash load A·σy', A*sy/1000, 'kN', 0)
      ],
      note: lam > 200
        ? ['Slenderness over 200 — beyond what most codes allow for a load-bearing member. Shorten the column or deepen the section.','bad']
        : euler
          ? ['Elastic (Euler) buckling governs — stiffness decides, not strength. A stronger alloy would NOT raise this load; a bigger section would.','']
          : ['Inelastic range — the Johnson parabola governs (λ '+F(lam,0)+' < λ₁ '+F(lam1,0)+'). Yield strength and section both matter here.','good']
    };
  }
},
{
  id:'cyl', group:'Structures', name:'Pressure cylinder',
  tags:'pressure vessel cylinder hoop stress longitudinal lame thin wall thick thickness',
  eq:'thin: σθ = pD/2t      thick: Lamé at the bore',
  sub:'Hoop and longitudinal stress, and the minimum wall the pressure needs.',
  inputs:[
    {k:'D', label:'Inside diameter', unit:'mm', v:300, step:10},
    {k:'t', label:'Wall thickness', unit:'mm', v:10, step:0.5},
    {k:'p', label:'Internal pressure', unit:'MPa', v:2, step:0.5},
    {k:'sa',label:'Allowable stress', unit:'MPa', v:120, step:10}
  ],
  run(v){
    const D=Math.max(10,v.D), t=Math.max(0.5,v.t), p=Math.max(0.01,v.p), sa=Math.max(1,v.sa);
    const rat = D/t, ri = D/2, ro = ri+t, thin = rat >= 20;
    const hoop = thin ? p*D/(2*t) : p*(ro*ro+ri*ri)/(ro*ro-ri*ri);
    const lon = p*D/(4*t);
    const treq = p*D/(2*sa - p);
    const fs = sa/hoop;
    return {
      hero:N('Hoop stress σθ', hoop, 'MPa', 1),
      pill: thin ? 'THIN WALL' : 'THICK · LAMÉ',
      rows:[
        N('Longitudinal σz', lon, 'MPa', 1),
        N('Safety factor', fs, '×', 2),
        N('D / t ratio', rat, '', 1),
        HEAD('Sizing'),
        N('Min wall at allowable', treq, 'mm', 2),
        N('Plus 3 mm corrosion', treq+3, 'mm', 2),
        N('Wall margin', t-treq, 'mm', 2),
        HEAD('At the joint'),
        N('Circumferential weld load', hoop*t, 'N/mm', 0),
        N('Longitudinal weld load', lon*t, 'N/mm', 0)
      ],
      note: fs < 1
        ? ['Hoop stress exceeds the allowable — the wall is undersized. Minimum thickness at this pressure is '+F(treq,1)+' mm before any corrosion allowance.','bad']
        : fs < 1.5
          ? ['Wall holds but the margin is thin (FS '+F(fs,2)+'). Pressure-vessel codes normally want more, plus a corrosion allowance.','warn']
          : [(thin ? 'Thin-wall theory applies (D/t '+F(rat,1)+' ≥ 20); hoop stress governs at twice the longitudinal.' : 'Thick-wall regime (D/t '+F(rat,1)+' < 20) — the Lamé peak at the bore is shown.'),'good']
    };
  }
},

    const key = KEYS.find(k=>dStd>k[0] && dStd<=k[1]);
    return {

      pill: dStd ? 'Ø'+dStd+' STD' : 'OVER RANGE',
      rows:[
        S('Next standard shaft', dStd ? 'Ø'+dStd+' mm' : '—'),
        S('Parallel key, DIN 6885', key ? key[2]+' mm' : '—'),
        N('Equivalent twisting Te', Te, 'N·m', 1),
        N('Allowable shear used', tauAll, 'MPa', 1),
        HEAD('Service factors'),
        N('Km — bending', svc[0], '×', 2),

        HEAD('At the standard size'),
        N('Polar modulus', dStd? Math.PI*dStd**3/16/1000 : 0, 'cm³', 2),

  inputs:[

    {k:'d2',label:'Driven pulley Ø', unit:'mm', v:315, step:5},

    {k:'sec',label:'Belt section', type:'seg', opts:[['Z','Z'],['A','A'],['B','B'],['C','C']], v:'A'}
  ],
  run(v){
    const VBS = {Z:0.10, A:0.26, B:0.45, C:0.80};
    const P=Math.max(0.1,v.P), d1=Math.max(50,v.d1), d2=Math.max(d1,v.d2);
    const C=Math.max((d2-d1)/2+30, v.C), n=Math.max(1,v.n);
    const V = Math.PI*d1*n/60000;
    const wrap = 180 - 2*Math.asin(clamp((d2-d1)/(2*C),-0.99,0.99))*180/Math.PI;
    const L = 2*C + Math.PI*(d1+d2)/2 + (d2-d1)**2/(4*C);
    const Kth = Math.max(0.6, 1 - 0.003*(180-wrap));
    const Pb = VBS[v.sec]*V*Kth;
    const nb = Math.max(1, Math.ceil(P*v.sf/Math.max(0.05, Pb)));

      hero:N('Belts required', nb, '', 0),
      pill:'Section '+v.sec,
      rows:[

  id:'vib', group:'Machine elements', name:'Vibration isolation',

  eq:'fn = √(k/m)/2π        T = √(1+(2ζr)²) / √((1−r²)²+(2ζr)²)',
  sub:'Natural frequency, transmissibility and isolation efficiency for a machine on mounts.',
  inputs:[
    {k:'m', label:'Machine mass', unit:'kg', v:500, step:50},
    {k:'k', label:'Total mount stiffness', unit:'kN/m', v:500, step:50},
    {k:'n', label:'Disturbing speed', unit:'rpm', v:1450, step:50},
    {k:'z', label:'Damping ratio ζ', type:'sel', opts:[[0.02,'Steel spring — 0.02'],[0.05,'Cork / felt — 0.05'],[0.10,'Rubber — 0.10'],[0.20,'Elastomer, high damping — 0.20']], v:0.10}
  ],
  run(v){
    const m=Math.max(1,v.m), k=Math.max(0.01,v.k), n=Math.max(1,v.n), z=v.z;
    const fn = Math.sqrt(k*1000/m)/(2*Math.PI);

    const sag = m*9.81/k;
    return {
      hero:N('Isolation', iso, '%', 1),
      pill:'r = '+F(r,2),
      rows:[

        HEAD('To improve it'),
        N('fn for 90 % isolation', f/Math.sqrt(11), 'Hz', 2),
        N('k for 90 % isolation', m*(2*Math.PI*f/Math.sqrt(11))**2/1000, 'kN/m', 0),

        N('Damping ratio ζ', z, '', 2)
      ],
      note: (r < 1.2 && r > 0.8)
        ? ['Running at '+F(r,2)+'× the natural frequency — near resonance, the mounts AMPLIFY vibration '+F(T,1)+'×. Soften the mounts substantially or stiffen them past it.','bad']
        : r <= Math.SQRT2
          ? ['Frequency ratio below √2 — the mounts transmit more than a rigid bolt-down would (T '+F(T,2)+'). Isolation needs r > √2; use softer mounts.','warn']
          : iso >= 90

    };
  }
},

/* ============================ state & rendering ============================ */
const STORE = {};
CALCS.forEach(c => { if (c.inputs){ const o={}; c.inputs.forEach(f=>o[f.k]=f.v); STORE[c.id]=o; } });

let current = CALCS[0].id;
let filtered = CALCS.slice();
let cursor = 0;

const $ = s => document.querySelector(s);
const rail = $('#rail'), work = $('#work'), qEl = $('#q');

function score(c, q){
  if (!q) return 0;
  const hay = (c.name+' '+c.group+' '+(c.tags||'')).toLowerCase();
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  let s = 0;
  for (const t of terms){
    const at = hay.indexOf(t);
    if (at < 0) return -1;
    s += (c.name.toLowerCase().indexOf(t) === 0) ? 100 : (c.name.toLowerCase().includes(t) ? 40 : 10);
  }
  return s;
}
function applyFilter(){
  const q = qEl.value.trim();
  if (!q){ filtered = CALCS.slice(); }
  else {
    filtered = CALCS.map(c=>({c, s:score(c,q)})).filter(x=>x.s >= 0)
                    .sort((a,b)=>b.s-a.s).map(x=>x.c);
  }
  cursor = 0;
  drawRail();
}
function drawRail(){
  rail.innerHTML = '';
  if (!filtered.length){ rail.innerHTML = '<div class="empty">Nothing matches. Try “bore”, “bolt”, “L10”, “DFM”, “OEE”.</div>'; return; }
  let g = null;
  filtered.forEach((c, idx) => {
    if (c.group !== g){ g = c.group; const h = document.createElement('div'); h.className='grouphead'; h.textContent=g; rail.appendChild(h); }
    const b = document.createElement('button');
    b.className = 'item' + (c.id===current ? ' sel' : '') + (qEl.value && idx===cursor ? ' sel' : '');
    b.innerHTML = '<span class="n">'+String(CALCS.indexOf(c)+1).padStart(2,'0')+'</span><span>'+c.name+'</span>';
    b.onclick = () => { select(c.id); };
    rail.appendChild(b);
  });
}
function select(id){
  current = id;
  drawRail();
  draw();
  const f = work.querySelector('input,select,textarea,.seg');
  if (f && f.focus) setTimeout(()=>f.focus(), 0);
}

function visibleInputs(c, v){ return (c.inputs||[]).filter(f => !f.when || f.when(v)); }

function draw(){
  const c = CALCS.find(x=>x.id===current);
  if (!c) return;
  const v = STORE[c.id];
  let html = '<h1 class="title">'+c.name+'</h1>';
  if (c.sub) html += '<p class="sub">'+c.sub+'</p>';
  if (c.eq)  html += '<div class="eq">'+c.eq+'</div>';

  if (c.ref || c.rules){
    html += '<div class="cols" style="grid-template-columns:1fr">';
    if (c.ref){
      html += '<section class="card"><h3>Reference</h3><table class="ref"><thead><tr>'
           +  c.ref.cols.map(h=>'<th>'+h+'</th>').join('') + '</tr></thead><tbody>'
           +  c.ref.rows.map(r=>'<tr>'+r.map((cell,i)=>'<td'+(i?' class="m"':'')+'>'+cell+'</td>').join('')+'</tr>').join('')
           +  '</tbody></table></section>';
    }
    if (c.rules){
      html += '<section class="card"><h3>Design rules</h3><ul class="rules">'
           +  c.rules.map(r=>'<li><b>'+r[0]+'</b> — '+r[1]+'</li>').join('')
           +  '</ul></section>';
    }
    html += '</div>';
    work.innerHTML = html;
    return;
  }

  const fields = visibleInputs(c, v);
  html += '<div class="cols"><section class="card"><h3>Inputs</h3><div class="fields">';
  fields.forEach(f=>{
    const val = v[f.k];
    const lab = '<label for="in_'+f.k+'">'+f.label+(f.hint?'<small>'+f.hint+'</small>':'')+'</label>';
    if (f.type==='sel'){
      html += '<div class="f">'+lab+'<div class="ctl"><select id="in_'+f.k+'" data-k="'+f.k+'">'
           + f.opts.map(o=>'<option value="'+o[0]+'"'+(String(o[0])===String(val)?' selected':'')+'>'+o[1]+'</option>').join('')
           + '</select></div></div>';
    } else if (f.type==='seg'){
      html += '<div class="f">'+lab+'<div class="ctl"><div class="segs">'
           + f.opts.map(o=>'<button type="button" class="seg'+(String(o[0])===String(val)?' on':'')+'" data-k="'+f.k+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('')
           + '</div></div></div>';
    } else if (f.type==='text'){
      html += '<div class="f wide">'+lab+'<textarea id="in_'+f.k+'" data-k="'+f.k+'" spellcheck="false">'
           + String(val).replace(/</g,'&lt;') + '</textarea></div>';
    } else {
      html += '<div class="f">'+lab+'<div class="ctl"><input id="in_'+f.k+'" data-k="'+f.k+'" type="number" step="'+(f.step||1)+'" value="'+val+'" /><span class="unit">'+(f.unit||'')+'</span></div></div>';
    }
  });
  html += '</div></section><section class="card" id="out"></section></div>';
  html += '<div class="foot"><button class="iconbtn" id="copy">Copy result</button>'
       +  '<button class="iconbtn" id="reset">Reset</button>'
       +  '<span class="hint">/ search · ↑↓ step a value · Esc back to search</span></div>';
  work.innerHTML = html;

  work.querySelectorAll('input,select,textarea').forEach(el=>{
    const ev = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(ev, e=>{
      const k = e.target.dataset.k;
      const f = c.inputs.find(x=>x.k===k);
      let nv = e.target.value;
      if (f.type!=='text' && f.type!=='seg'){
        if (f.type==='sel'){ nv = isNaN(parseFloat(nv)) ? nv : (f.opts.some(o=>typeof o[0]==='number') ? parseFloat(nv) : nv); }
        else nv = parseFloat(nv);
        if (f.type!=='sel' && !isFinite(nv)) nv = 0;
      }
      STORE[c.id][k] = nv;
      const before = fields.length;
      const after = visibleInputs(c, STORE[c.id]).length;
      if (before !== after || f.type==='sel' && c.inputs.some(x=>x.when)) { const p=document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null; draw(); const nx = p && work.querySelector('[data-k="'+p+'"]'); if (nx) nx.focus(); }
      else compute();
      save();
    });
  });
  work.querySelectorAll('.seg').forEach(b=>{
    b.addEventListener('click', ()=>{
      STORE[c.id][b.dataset.k] = b.dataset.v;
      draw(); save();
    });
  });
  const cp = $('#copy'); if (cp) cp.onclick = copyResult;
  const rs = $('#reset'); if (rs) rs.onclick = ()=>{ const o={}; c.inputs.forEach(f=>o[f.k]=f.v); STORE[c.id]=o; draw(); save(); };
  compute();
}

let lastText = '';
function compute(){
  const c = CALCS.find(x=>x.id===current);
  const out = $('#out');
  if (!c || !c.run || !out) return;
  let r;
  try { r = c.run(STORE[c.id]); }
  catch(err){ out.innerHTML = '<h3>Result</h3><p class="note bad">Check the inputs — '+err.message+'</p>'; return; }
  const heroVal = (typeof r.hero.value === 'string') ? r.hero.value : F(r.hero.value, r.hero.d);
  let html = '<h3>Result'+(r.pill?'<span class="pill">'+r.pill+'</span>':'')+'</h3>';
  html += '<div class="hero"><div class="lab">'+r.hero.label+'</div><div class="val">'+heroVal
       +  (r.hero.unit?'<u>'+r.hero.unit+'</u>':'')+'</div></div><div class="rows">';
  const lines = [c.name+' — '+r.hero.label+': '+heroVal+' '+(r.hero.unit||'')];
  r.rows.forEach(row=>{
    if (row.head){ html += '<div class="r head"><span class="k">'+row.label+'</span></div>'; return; }
    const val = (typeof row.value === 'string') ? row.value : F(row.value, row.d);
    html += '<div class="r"><span class="k">'+row.label+'</span><span class="v">'+val+'</span><span class="u">'+(row.unit||'')+'</span></div>';
    lines.push('  '+row.label+': '+val+' '+(row.unit||''));
  });
  html += '</div>';
  if (r.note) html += '<p class="note '+(r.note[1]||'')+'">'+r.note[0]+'</p>';
  out.innerHTML = html;
  lastText = lines.join('\n');
}
function copyResult(){
  const b = $('#copy'); if (!b) return;
  const done = () => { const t=b.textContent; b.textContent='Copied'; setTimeout(()=>b.textContent=t, 1100); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lastText).then(done, fallback);
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = lastText; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){}
    document.body.removeChild(ta);
  }
}

/* ---------------- persistence (best effort) ---------------- */
function save(){ try{ localStorage.setItem('mechCalc', JSON.stringify({s:STORE, c:current})); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem('mechCalc'); if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.s) Object.keys(STORE).forEach(k=>{ if (d.s[k]) Object.assign(STORE[k], d.s[k]); });
    if (d && d.c && CALCS.some(x=>x.id===d.c)) current = d.c;
  }catch(e){}
}
function theme(set){
  const root = document.documentElement;
  const next = set || (root.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('mechCalcTheme', next); }catch(e){}
}
try{ const t = localStorage.getItem('mechCalcTheme'); if (t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
$('#theme').onclick = ()=>theme();

/* ---------------- keyboard ---------------- */
qEl.addEventListener('input', applyFilter);
qEl.addEventListener('keydown', e=>{
  if (e.key==='ArrowDown'){ e.preventDefault(); cursor = Math.min(filtered.length-1, cursor+1); drawRail(); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); cursor = Math.max(0, cursor-1); drawRail(); }
  else if (e.key==='Enter'){ e.preventDefault(); if (filtered[cursor]) select(filtered[cursor].id); }
  else if (e.key==='Escape'){ qEl.value=''; applyFilter(); qEl.blur(); }
});
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if ((e.key==='/' && !typing) || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k')){
    e.preventDefault(); qEl.focus(); qEl.select();
  } else if (e.key==='Escape' && typing && document.activeElement!==qEl){
    document.activeElement.blur(); qEl.focus(); qEl.select();
  }
});

load(); applyFilter(); draw();
</script>
