<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQL — SQLZoo Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- SQLite engine (sql.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>

<!-- Practice data (swap these for your own SQLZOO_SCHEMA / SQLZOO_SEED / SQLZOO_EXERCISES) -->
<script src="sqlzoo-seed.js"></script>
<script src="sqlzoo-exercises.js"></script>

<style>
  :root {
    --font-display: "Cormorant Garamond", Georgia, serif;
    --font-body: "EB Garamond", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: var(--font-body); color: #211b13; font-size: 18px; line-height: 1.6;
    background-color: #efe7d6;
    background-image:
      radial-gradient(circle at 16% 10%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 38%),
      radial-gradient(circle at 86% 80%, rgba(160,138,96,0.10) 0%, rgba(160,138,96,0) 44%);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 30px 32px 96px; }
  /* responsive helpers used by the component */
  @media (max-width: 760px) { .zoo-lab-grid { grid-template-columns: 1fr !important; } }
  @media (max-width: 680px) { .zoo-tabs-label { display: none !important; } }
</style>
</head>
<body>
<div class="wrap"><div id="root"></div></div>

<!-- The practice component (self-contained; sets window.SqlZooLab) -->
<script type="text/babel" src="sqlzoo-lab.jsx"></script>

<script type="text/babel">
  // Mount. onBack is called by the in-page "SQL /" breadcrumb link — point it
  // wherever your app's SQL hub lives.
  function App() {
    return <window.SqlZooLab onBack={() => { if (history.length > 1) history.back(); else location.href = "index.html"; }} />;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
