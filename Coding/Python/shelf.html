<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Shelf · Python · Commonplace</title>
<link href="../../_lib/fonts/gf-135340b0.css" rel="stylesheet">
<link rel="stylesheet" href="css/shelf.css" />
<style>
.folder-head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid var(--accent,var(--line))}
.fh-mark{width:54px;height:54px;color:var(--accent,var(--green));flex:none;align-self:flex-end;margin-bottom:2px}
.fh-mark svg{width:100%;height:100%;display:block}
.fh-t{color:var(--ink)}
.fh-s .v{color:var(--accent,var(--green-dk))}
.part-n{color:var(--green-dk)}
.l-s{color:var(--green-dk)}
.part-c b{color:var(--green-dk)}
.tally i.r{border-color:var(--accent,var(--green));background:var(--accent,var(--green))}
.tally i.w{border-color:var(--accent,var(--green-dk))}
.key i.r{border-color:var(--accent,var(--green));background:var(--accent,var(--green))}
.fh-kick{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink-mute)}
.fh-t{font-family:var(--disp);font-weight:600;font-size:clamp(38px,6vw,58px);line-height:.92;letter-spacing:-1px;margin:6px 0 0}
.fh-sub{font-style:italic;font-size:16.5px;color:var(--ink-soft);margin:10px 0 0;max-width:62ch;text-wrap:pretty}
.fh-stats{margin-left:auto;display:flex;gap:26px;padding-bottom:4px}
.fh-s{display:flex;flex-direction:column;gap:4px}
.fh-s .l{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-mute)}
.fh-s .v{font-family:var(--mono);font-size:14px;font-weight:600}
.toc{margin-top:6px}
.part{border-bottom:1px solid var(--line-soft)}
.part-row{display:grid;grid-template-columns:44px 1fr auto auto 18px;align-items:center;gap:16px;padding:13px 6px 13px 2px;cursor:pointer;user-select:none;transition:background .15s}
.part-row:hover{background:rgba(251,252,246,.8)}
.part-n{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--green);letter-spacing:.3px}
.part-t{font-family:var(--disp);font-weight:600;font-size:23px;line-height:1.05;letter-spacing:-.2px}
.part.planned .part-t{color:var(--ink-soft);font-weight:500}.part.planned .part-n{color:var(--ink-mute)}
.tally{display:flex;gap:4px;align-items:center}
.tally i{display:block;width:9px;height:9px;border-radius:2px;border:1px dashed var(--ink-mute);opacity:.55;background:transparent}
.tally i.w{border:1.5px solid var(--green-dk);background:var(--card);opacity:1}
.tally i.r{border:1.5px solid var(--green);background:var(--green);opacity:1}
.part-c{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);min-width:74px;text-align:right;white-space:nowrap}
.part-c b{color:var(--green-dk);font-weight:700}
.caret{font-family:var(--mono);font-size:11px;color:var(--ink-mute);transition:transform .15s;text-align:center}
.part.open .caret{transform:rotate(90deg)}
.part-body{display:none;padding:2px 0 18px 60px}.part.open .part-body{display:block}
.lesson{display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;gap:14px;padding:8px 6px;border-radius:7px;text-decoration:none;color:var(--ink);transition:background .15s}
a.lesson:hover{background:var(--card);color:var(--ink)}
.l-n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-mute)}
.l-t{font-size:17px;line-height:1.35}
.lesson.r .l-t{color:var(--ink-soft)}.lesson.p .l-t{color:var(--ink-mute)}
.l-s{font-family:var(--mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.lesson.r .l-s{color:var(--green)}.lesson.w .l-s{color:var(--green-dk);font-weight:700}.lesson.p .l-s{color:var(--ink-mute)}
.l-s .pct{font-weight:400;color:var(--ink-mute);letter-spacing:0}
.planned-note{font-style:italic;font-size:15px;color:var(--ink-mute);padding:6px 6px 0}
.planned-note b{font-family:var(--mono);font-style:normal;font-weight:600;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
.tryit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 6px 0;padding-top:12px;border-top:1px dashed var(--line)}
.tryit .k{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-mute);margin-right:4px}
.nb{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:600;color:#dfeee4;background:var(--green-deep);border:1px solid var(--green-dk);border-radius:6px;padding:5px 10px 5px 8px;text-decoration:none;transition:background .15s}
.nb:hover{background:var(--green-dk);color:#fff}.nb .nn{color:var(--sage);font-weight:700;font-size:10px}.nb .rn{color:var(--sage);opacity:.8}
.key{display:flex;align-items:center;gap:6px;margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
.key i{display:inline-block;width:9px;height:9px;border-radius:2px;border:1px dashed var(--ink-mute);opacity:.55}
.key i.w{border:1.5px solid var(--green-dk);background:var(--card);opacity:1}
.key i.r{border:1.5px solid var(--green);background:var(--green);opacity:1}
.nblist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:24px}
.nbcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sage);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:transform .14s,box-shadow .14s,border-color .14s}
.nbcard:hover{transform:translateY(-2px);border-left-color:var(--green);box-shadow:0 12px 26px -18px rgba(20,40,30,.6);color:var(--ink)}
.nbcard .idx{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--green-dk);background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:32px;text-align:center}
.nbcard .ct{flex:1;font-family:var(--disp);font-weight:600;font-size:19px;line-height:1.1}
.nbcard .go{font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--green)}
.empty-state{margin-top:26px;border:1px dashed var(--line);border-radius:12px;padding:28px 26px;background:rgba(251,252,246,.6)}
.empty-state h3{font-family:var(--disp);font-weight:600;font-size:24px;margin:0 0 8px;letter-spacing:-.2px}
.empty-state p{margin:0;font-style:italic;color:var(--ink-soft);max-width:58ch;text-wrap:pretty}
.empty-state .plan{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:11px;color:var(--ink-mute);line-height:1.8}
.back{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--green-dk);text-decoration:none;margin-top:34px}
.back:hover{color:var(--green-deep)}
@media (max-width:720px){.part-row{grid-template-columns:36px 1fr 18px;row-gap:6px}.tally{grid-column:2}.part-c{grid-column:2;text-align:left;min-width:0}.part-body{padding-left:0}.lesson{grid-template-columns:30px 1fr;row-gap:2px}.l-s{grid-column:2}.fh-stats{margin-left:0}}
</style>
</head>
