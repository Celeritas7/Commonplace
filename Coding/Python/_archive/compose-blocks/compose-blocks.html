<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Compose Blocks — Python editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

<!-- React + Babel (pinned, same versions as the practice page) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Seed blocks (swap for your own COMPOSE_BLOCKS_SEED) -->
<script src="compose-blocks-data.js"></script>

<!-- Pyodide is NOT loaded here on purpose: the component lazy-loads CPython on the
     first run so the "warming up the Python runtime…" state is meaningful. -->

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #e9e4d8; color: #2b2b2b;
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 80px; -webkit-tap-highlight-color: transparent;
  }
  #root { width: 100%; display: flex; justify-content: center; }
  .caption { max-width: 380px; margin: 18px auto 0; font-family: "JetBrains Mono", monospace;
    font-size: 11px; line-height: 1.7; color: rgba(43,43,43,.55); text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
<p class="caption">Runs real CPython in your browser via Pyodide — the first run downloads ~6&nbsp;MB, then it's cached. Block order is the lesson: put <code>main</code> above <code>def&nbsp;is_odd</code> and run to see the teaching error.</p>

<!-- The component (self-contained; sets window.ComposeBlocks) -->
<script type="text/babel" src="compose-blocks.jsx"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("root"))
    .render(<window.ComposeBlocks seed={window.COMPOSE_BLOCKS_SEED} />);
</script>
</body>
</html>
