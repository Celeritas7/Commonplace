<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Python — Practice & Mistake Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- CPython in the browser (Pyodide) -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

<!-- Practice data (swap this for your own PY_PRACTICE_EX) -->
<script src="python-practice-data.js"></script>

<style>
  :root {
    --font-display: "Cormorant Garamond", Georgia, serif;
    --font-body: "EB Garamond", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: var(--font-body); color: #1a2820; font-size: 18px; line-height: 1.6;
    background-color: #efe7d6;
    background-image:
      radial-gradient(circle at 16% 10%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 38%),
      radial-gradient(circle at 86% 80%, rgba(120,150,128,0.10) 0%, rgba(120,150,128,0) 44%);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 30px 32px 96px; }
  @media (max-width: 680px) { .pyp-tabs-label { display: none !important; } }
</style>
</head>
<body>
<div class="wrap"><div id="root"></div></div>

<!-- The practice component (self-contained; sets window.PythonPracticeSection) -->
<script type="text/babel" src="python-practice-lab.jsx"></script>

<script type="text/babel">
  // The component renders its own section header via a SecHead you pass in.
  // This is a minimal green-themed version matching the Python page.
  function SecHead({ n, title, count, children }) {
    return (
      <div style={{ display: "flex", alignItems: "baseline", gap: "14px", marginBottom: "6px" }}>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: "12px", fontWeight: 700, color: "#2f6b4f" }}>§ {n}</span>
        <h2 style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: "32px", lineHeight: 1, letterSpacing: "-0.3px", margin: 0, whiteSpace: "nowrap", color: "#1a2820" }}>{title}</h2>
        {count != null && <span style={{ fontFamily: "var(--font-mono)", fontSize: "11px", fontWeight: 700, color: "#2f6b4f", background: "#dde7dd", border: "1px solid #7fa68b", borderRadius: "999px", padding: "2px 9px" }}>{count}</span>}
        {children}
        <span style={{ flex: 1, height: "1px", background: "#d2dacb", transform: "translateY(-5px)" }} />
      </div>
    );
  }
  function App() { return <window.PythonPracticeSection SecHead={SecHead} />; }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
