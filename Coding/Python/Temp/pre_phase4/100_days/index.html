<script src="../../../_lib/supabase.js"></script>
<script>(function APP(){
  var root = document.getElementById('root');
  var DATA = [];
  var currentUser = null, loading = false, loadErr = '';
  var NOTES = {}; try { NOTES = JSON.parse(localStorage.getItem('cp_chain_notes') || '{}'); } catch(e){}
  var expanded = {}, selected = {};

  /* ---------- Supabase (same project/keys as Python/index.html) ---------- */
  var SUPABASE_URL = "https://wylxvmkcrexwfpjpbhyy.supabase.co";
  var SUPABASE_KEY = "sb_publishable_e3pDOuxIdstaC7s0a680kQ_R10TrAyv";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  function vinfo(p){
    if (p === true)  return { c:'#2f6b4f', fg:'#234f3b', bg:'rgba(47,107,79,.16)', label:'passed' };
    if (p === false) return { c:'#b3261e', fg:'#b3261e', bg:'rgba(190,40,30,.14)', label:'failed' };
    return { c:'#7a8c80', fg:'#7a8c80', bg:'rgba(122,140,128,.16)', label:'ungraded' };
  }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---------- map Supabase rows -> view model ---------- */
  function sectionOf(ex){
    var tags = ex.tags || [];
    for (var i = 0; i < tags.length; i++){ if (!/^import:/i.test(tags[i])) return tags[i]; }
    return 'Ungrouped';
  }
  function sectionSortKey(name){
    var m = /^\s*Section\s+(\d+)/i.exec(name);
    return m ? [0, parseInt(m[1], 10), ''] : [1, 0, String(name).toLowerCase()];
  }
  function byCreatedAsc(a, b){ return String(a.created_at || '').localeCompare(String(b.created_at || '')); }

  function buildData(rows){
    var groups = {}, order = [];
    (rows || []).forEach(function(ex){
      var s = sectionOf(ex);
      if (!groups[s]){ groups[s] = []; order.push(s); }
      var attempts = (ex.commonplace_attempts || []).slice().sort(byCreatedAsc)
        .map(function(a){ return { passed: a.passed, stdout: a.stdout, code: a.code || '' }; });
      var mistakes = (ex.commonplace_mistakes || []).slice().sort(byCreatedAsc)
        .map(function(m){ return { reason: m.reason, resolved: m.resolved }; });
      groups[s].push({ id: ex.id, title: ex.title || 'Untitled', prompt: ex.prompt || '', tags: ex.tags || [], attempts: attempts, mistakes: mistakes });
    });
    order.sort(function(a, b){ var ka = sectionSortKey(a), kb = sectionSortKey(b); return ka[0]-kb[0] || ka[1]-kb[1] || ka[2].localeCompare(kb[2]); });
    return order.map(function(name){ return { section: name, exercises: groups[name] }; });
  }

  function loadData(){
    if (!currentUser){ DATA = []; loading = false; loadErr = ''; render(); return; }
    loading = true; loadErr = ''; render();
    sb.from('commonplace_exercises')
      .select('*, commonplace_attempts(*), commonplace_mistakes(*)')
      .eq('subject', 'python')
      .order('order_index')
      .then(function(res){
        loading = false;
        if (res.error){ loadErr = res.error.message; DATA = []; }
        else { DATA = buildData(res.data || []); }
        render();
      });
  }

  /* ---------- auth pill (magic link) ---------- */
  function renderAuth(){
    var el = document.getElementById('cc-auth'); if (!el) return;
    if (currentUser){
      el.innerHTML = '<span class="cc-who">' + esc(currentUser.email) + '</span><button class="cc-authbtn" data-act="signout">Sign out</button>';
    } else {
      el.innerHTML = '<input type="email" id="cc-email" placeholder="you@email.com" autocomplete="email"><button class="cc-authbtn primary" data-act="magic">Email me a link</button>';
    }
  }
  function sendMagicLink(){
    var inp = document.getElementById('cc-email');
    var email = (inp && inp.value || '').trim();
    if (!email){ return; }
    var btn = document.querySelector('[data-act="magic"]'); if (btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
    sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.href.split('#')[0] } })
      .then(function(res){ alert(res.error ? ('Error: ' + res.error.message) : 'Check your inbox for the sign-in link.'); })
      .catch(function(e){ alert('Error: ' + e.message); })
      .finally(function(){ if (btn){ btn.disabled = false; btn.textContent = 'Email me a link'; } });
  }

  function diffLines(a, b){
    var n = a.length, m = b.length, i, j;
    var dp = []; for (i = 0; i <= n; i++){ dp[i] = []; for (j = 0; j <= m; j++) dp[i][j] = 0; }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
    var rows = []; i = 0; j = 0;
    while (i < n && j < m){
      if (a[i] === b[j]) { rows.push({t:'same', l:a[i], r:b[j]}); i++; j++; }
      else if (dp[i+1][j] >= dp[i][j+1]) { rows.push({t:'del', l:a[i]}); i++; }
      else { rows.push({t:'add', r:b[j]}); j++; }
    }
    while (i < n){ rows.push({t:'del', l:a[i]}); i++; }
    while (j < m){ rows.push({t:'add', r:b[j]}); j++; }
    return rows;
  }

  function toggleSelect(ex, i){
    var cur = (selected[ex] || []).slice(), p = cur.indexOf(i);
    if (p >= 0) cur.splice(p, 1); else { cur.push(i); if (cur.length > 2) cur.shift(); }
    selected[ex] = cur;
  }

  function chainHtml(ex){
    var sel = selected[ex.id] || [], out = '';
    ex.attempts.forEach(function(att, i){
      var info = vinfo(att.passed), isSel = sel.indexOf(i) >= 0;
      var pos = sel.indexOf(i), badge = pos === 0 ? 'A' : (pos === 1 ? 'B' : '');
      if (i > 0){
        var prev = vinfo(ex.attempts[i-1].passed);
        out += '<div class="cc-conn" style="background:linear-gradient(to right,'+prev.c+','+info.c+')"></div>';
      }
      out += '<div class="cc-node">'
        + '<span class="cc-ver">v'+(i+1)+'</span>'
        + '<div class="cc-dot" data-act="toggle" data-ex="'+ex.id+'" data-att="'+i+'" title="Show code" style="background:'+info.c+';box-shadow:0 0 0 4px #fbfcf6, 0 0 0 '+(isSel?7:5)+'px '+(isSel?'rgba(60,131,98,.55)':info.c+'33')+'"></div>'
        + '<span class="cc-chip" style="background:'+info.bg+';color:'+info.fg+'">'+info.label+'</span>'
        + '<div class="cc-selrow"><button class="cc-selbtn'+(isSel?' on':'')+'" data-act="select" data-ex="'+ex.id+'" data-att="'+i+'" title="Select to compare">&#8644;</button>'
        + (badge ? '<span class="cc-abadge">'+badge+'</span>' : '') + '</div>'
        + '</div>';
    });
    var last = ex.attempts[ex.attempts.length - 1];
    if (ex.attempts.length > 1 && last && last.passed === true){
      out += '<div class="cc-conn" style="background:#2f6b4f"></div>'
        + '<div class="cc-solved"><div class="cc-solveddot">&#10003;</div><span>solved &middot; '+ex.attempts.length+' tries</span></div>';
    }
    return out;
  }

  function panelsHtml(ex){
    var out = '';
    ex.attempts.forEach(function(att, i){
      if (!expanded[ex.id+':'+i]) return;
      var info = vinfo(att.passed);
      out += '<div class="cc-panel">'
        + '<div class="cc-panelhead"><span class="cc-pdot" style="background:'+info.c+'"></span>'
        + '<span class="cc-pver">v'+(i+1)+'</span>'
        + '<span class="cc-chip" style="background:'+info.bg+';color:'+info.fg+'">'+info.label+'</span></div>'
        + '<pre class="cc-pre">'+esc(att.code)+'</pre>'
        + (att.stdout ? '<div class="cc-outlabel">Output</div><pre class="cc-out">'+esc(att.stdout)+'</pre>' : '')
        + '</div>';
    });
    return out;
  }

  function cmpHtml(ex){
    var sel = (selected[ex.id] || []).slice().sort(function(a,b){ return a-b; });
    if (sel.length !== 2) return '';
    var A = ex.attempts[sel[0]], B = ex.attempts[sel[1]];
    var rows = diffLines(A.code.split('\n'), B.code.split('\n'));
    var addN = 0, delN = 0, cells = '';
    rows.forEach(function(r){
      if (r.t === 'same') cells += '<div class="cc-d cc-l">  '+esc(r.l)+'</div><div class="cc-d">  '+esc(r.r)+'</div>';
      else if (r.t === 'del'){ delN++; cells += '<div class="cc-d cc-l cc-del">&#8722; '+esc(r.l)+'</div><div class="cc-d cc-empty"> </div>'; }
      else { addN++; cells += '<div class="cc-d cc-l cc-empty"> </div><div class="cc-d cc-add">+ '+esc(r.r)+'</div>'; }
    });
    return '<div class="cc-cmp">'
      + '<div class="cc-cmphead"><span class="cc-cmptitle">Comparing v'+(sel[0]+1)+' &#9656; v'+(sel[1]+1)+'</span>'
      + '<span class="cc-add-n">+'+addN+'</span><span class="cc-del-n">&#8722;'+delN+'</span>'
      + '<button class="cc-clear" data-act="clear" data-ex="'+ex.id+'">clear</button></div>'
      + '<div class="cc-diff">'+cells+'</div>'
      + '<div class="cc-notewrap"><div class="cc-notelabel">What was my mistake?</div>'
      + '<textarea class="cc-note" data-act="note" data-ex="'+ex.id+'" placeholder="e.g. forgot the return / len() check that turns the divisor count into True or False...">'+esc(NOTES[ex.id] || '')+'</textarea></div>'
      + '</div>';
  }

  function mistakesHtml(ex){
    var out = '<div class="cc-sublabel" style="margin-top:14px">Mistakes</div>';
    if (ex.mistakes && ex.mistakes.length){
      out += '<div class="cc-mislist">';
      ex.mistakes.forEach(function(m){
        out += '<div class="cc-mis"><span class="cc-mis-tag">Note</span>'
          + '<span class="cc-mis-txt">'+esc(m.reason)+'</span>'
          + (m.resolved ? '<span class="cc-mis-res">resolved</span>' : '') + '</div>';
      });
      out += '</div>';
    } else {
      out += '<div class="cc-nomis">No mistakes filed.</div>';
    }
    return out;
  }

  function cardHtml(ex){
    var badges = (ex.tags || []).map(function(t){ return '<span class="cc-tag">'+esc(t)+'</span>'; }).join('');
    return '<div class="cc-card">'
      + '<div class="cc-cardhead"><span class="cc-extitle">'+esc(ex.title)+'</span><span class="cc-badges">'+badges+'</span></div>'
      + (ex.prompt ? '<p class="cc-prompt">'+esc(ex.prompt)+'</p>' : '')
      + '<div class="cc-subrow"><div class="cc-sublabel">Attempt chain</div><div class="cc-hint">tap a dot for its code &middot; pick two to diff</div></div>'
      + '<div class="cc-chain">'+chainHtml(ex)+'</div>'
      + panelsHtml(ex) + cmpHtml(ex) + mistakesHtml(ex)
      + '</div>';
  }

  function headerHtml(count){
    return '<div class="cc-head">'
      + '<span class="cc-sec">&sect; III</span>'
      + '<h2 class="cc-h2">100 Days (Angela Yu)</h2>'
      + '<span class="cc-count">'+count+'</span>'
      + '<span class="cc-rule"></span>'
      + '<button class="cc-reset" data-act="reset">&#8635; Reset</button></div>'
      + '<p class="cc-intro">Each problem is a chain of your attempts. Walk the journey &mdash; then pick any two blocks to diff and see exactly what turned a broken attempt into a working one.</p>'
      + '<div class="cc-legend">'
      + '<span><i style="background:#b3261e"></i>failed</span>'
      + '<span><i style="background:#2f6b4f"></i>passed</span>'
      + '<span><i style="background:#7a8c80"></i>ungraded</span>'
      + '<span class="cc-bar">|</span><span>select two dots to compare</span></div>';
  }
  function stateBox(msg){ return '<div class="cc-state">'+msg+'</div>'; }

  function render(){
    renderAuth();
    if (!currentUser){ root.innerHTML = headerHtml('&mdash;') + stateBox('Sign in (top-right) to load your 100 Days attempt chains from Supabase.'); return; }
    if (loading){ root.innerHTML = headerHtml('&mdash;') + stateBox('Loading your Python practice&hellip;'); return; }
    if (loadErr){ root.innerHTML = headerHtml('&mdash;') + stateBox('Could not load: ' + esc(loadErr)); return; }
    var total = 0; DATA.forEach(function(s){ total += s.exercises.length; });
    var html = headerHtml(total);
    if (!total){ root.innerHTML = html + stateBox('No Python exercises found for your account yet. Practise with subject = python and they will appear here.'); return; }
    DATA.forEach(function(sec){
      html += '<div class="cc-section"><h3>'+esc(sec.section)+'</h3><span class="cc-count">'+sec.exercises.length+'</span></div>';
      sec.exercises.forEach(function(ex){ html += cardHtml(ex); });
    });
    root.innerHTML = html;
  }

  root.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'toggle'){ var k = t.getAttribute('data-ex')+':'+t.getAttribute('data-att'); expanded[k] = !expanded[k]; render(); }
    else if (act === 'select'){ e.stopPropagation(); toggleSelect(t.getAttribute('data-ex'), +t.getAttribute('data-att')); render(); }
    else if (act === 'clear'){ selected[t.getAttribute('data-ex')] = []; render(); }
    else if (act === 'reset'){ expanded = {}; selected = {}; render(); }
  });
  root.addEventListener('input', function(e){
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-act') === 'note'){
      NOTES[t.getAttribute('data-ex')] = t.value;
      try { localStorage.setItem('cp_chain_notes', JSON.stringify(NOTES)); } catch(err){}
    }
  });
  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('[data-act]') : null; if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'signout') sb.auth.signOut();
    else if (a === 'magic') sendMagicLink();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target && e.target.id === 'cc-email') sendMagicLink();
  });

  renderAuth();
  sb.auth.onAuthStateChange(function(_e, session){ currentUser = session ? session.user : null; loadData(); });
  sb.auth.getSession().then(function(res){ currentUser = res.data.session ? res.data.session.user : null; loadData(); });
  render();
})();</script>
<script src="../../../_lib/progress-backup.js"></script>
