<script type="application/json" id="nbdata">[{"t": "md", "s": "🔁 **Python `while` Loop — Complete Study Notebook**\n\nThis notebook explains `while` loops using:\n- 📘 Concept\n- 🧠 Real-world use cases\n- 💻 Executable code\n- 📤 Example output\n\nA `while` loop repeats **as long as a condition is true**."}, {"t": "md", "s": "## 1️⃣ Basic while loop\n\n📘 **Concept**\nRepeats execution while a condition remains true.\n\n🧠 **Use cases**\n- Counters\n- Repeated polling"}, {"t": "code", "s": "i = 0\nwhile i < 5:\n    print(i)\n    i += 1"}, {"t": "md", "s": "📤 **Output (example)**\n```\n0\n1\n2\n3\n4\n```"}, {"t": "md", "s": "## 2️⃣ Countdown loop\n\n📘 **Concept**\nUseful for reverse iteration.\n\n🧠 **Use cases**\n- Timers\n- Retry limits"}, {"t": "code", "s": "i = 5\nwhile i > 0:\n    print(i)\n    i -= 1"}, {"t": "md", "s": "📤 **Output (example)**\n```\n5\n4\n3\n2\n1\n```"}, {"t": "md", "s": "## 3️⃣ Infinite loop with break\n\n📘 **Concept**\nLoop runs forever unless broken.\n\n🧠 **Use cases**\n- Event listeners\n- Game loops"}, {"t": "code", "s": "i = 0\nwhile True:\n    print(i)\n    i += 1\n    if i == 3:\n        break"}, {"t": "md", "s": "📤 **Output (example)**\n```\n0\n1\n2\n```"}, {"t": "md", "s": "## 4️⃣ Using continue\n\n📘 **Concept**\nSkip current iteration.\n\n🧠 **Use cases**\n- Filtering invalid data"}, {"t": "code", "s": "i = 0\nwhile i < 6:\n    i += 1\n    if i == 3:\n        continue\n    print(i)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n1\n2\n4\n5\n6\n```"}, {"t": "md", "s": "## 5️⃣ User input loop\n\n📘 **Concept**\nLoop until a valid input is received.\n\n🧠 **Use cases**\n- CLI tools\n- Validation"}, {"t": "code", "s": "password = \"\"\nwhile password != \"secret\":\n    password = \"secret\"\n    print(\"Trying...\")\nprint(\"Access granted\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nTrying...\nAccess granted\n```"}, {"t": "md", "s": "## 6️⃣ Accumulator pattern\n\n📘 **Concept**\nUsed for summation or aggregation.\n\n🧠 **Use cases**\n- Statistics\n- Running totals"}, {"t": "code", "s": "total = 0\ni = 1\nwhile i <= 5:\n    total += i\n    i += 1\nprint(total)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n15\n```"}, {"t": "md", "s": "## 7️⃣ While loop with list\n\n📘 **Concept**\nProcess elements using index.\n\n🧠 **Use cases**\n- Manual iteration"}, {"t": "code", "s": "items = ['a', 'b', 'c']\ni = 0\nwhile i < len(items):\n    print(items[i])\n    i += 1"}, {"t": "md", "s": "📤 **Output (example)**\n```\na\nb\nc\n```"}, {"t": "md", "s": "## 8️⃣ Sentinel-controlled loop\n\n📘 **Concept**\nLoop until sentinel value appears.\n\n🧠 **Use cases**\n- File reading\n- Streams"}, {"t": "code", "s": "data = [1, 2, -1, 4]\ni = 0\nwhile data[i] != -1:\n    print(data[i])\n    i += 1"}, {"t": "md", "s": "📤 **Output (example)**\n```\n1\n2\n```"}, {"t": "md", "s": "## 9️⃣ Nested while loops\n\n📘 **Concept**\nWhile loops inside while loops.\n\n🧠 **Use cases**\n- Grids\n- Matrix operations"}, {"t": "code", "s": "i = 1\nwhile i <= 3:\n    j = 1\n    while j <= 3:\n        print(i, j)\n        j += 1\n    i += 1"}, {"t": "md", "s": "📤 **Output (example)**\n```\n1 1\n1 2\n1 3\n2 1\n2 2\n2 3\n3 1\n3 2\n3 3\n```"}, {"t": "md", "s": "## 🔟 Loop with condition update\n\n📘 **Concept**\nCondition depends on runtime changes.\n\n🧠 **Use cases**\n- Control systems"}, {"t": "code", "s": "value = 10\nwhile value > 0:\n    print(value)\n    value //= 2"}, {"t": "md", "s": "📤 **Output (example)**\n```\n10\n5\n2\n1\n```"}, {"t": "md", "s": "## ✅ Final Notes\n\n- Always ensure termination condition\n- Beware of infinite loops\n- Prefer `for` when iteration count is known\n- `while` is ideal for condition-based repetition"}]</script>
