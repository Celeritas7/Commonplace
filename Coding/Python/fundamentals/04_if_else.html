<script type="application/json" id="nbdata">[{"t": "md", "s": "🔀 **Python `if–else` — Complete Study Notebook**\n\nThis notebook explains conditional logic using:\n- 📘 Concept\n- 🧠 Real-world use cases\n- 💻 Executable code\n- 📤 Example output\n\nConditional statements allow programs to make decisions."}, {"t": "md", "s": "## 1️⃣ Basic if statement\n\n📘 **Concept**\nExecutes a block only if a condition is true.\n\n🧠 **Use cases**\n- Validation\n- Feature flags"}, {"t": "code", "s": "x = 10\nif x > 5:\n    print(\"x is greater than 5\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nx is greater than 5\n```"}, {"t": "md", "s": "## 2️⃣ if–else statement\n\n📘 **Concept**\nChooses between two paths.\n\n🧠 **Use cases**\n- Pass/fail logic\n- Access control"}, {"t": "code", "s": "x = 3\nif x > 5:\n    print(\"x is greater than 5\")\nelse:\n    print(\"x is 5 or less\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nx is 5 or less\n```"}, {"t": "md", "s": "## 3️⃣ if–elif–else ladder\n\n📘 **Concept**\nChecks multiple conditions in sequence.\n\n🧠 **Use cases**\n- Grading systems\n- Categorization"}, {"t": "code", "s": "score = 72\nif score >= 90:\n    print(\"Grade A\")\nelif score >= 75:\n    print(\"Grade B\")\nelif score >= 60:\n    print(\"Grade C\")\nelse:\n    print(\"Fail\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nGrade C\n```"}, {"t": "md", "s": "## 4️⃣ Nested if statements\n\n📘 **Concept**\nConditions inside conditions.\n\n🧠 **Use cases**\n- Multi-level validation"}, {"t": "code", "s": "age = 20\nhas_id = True\nif age >= 18:\n    if has_id:\n        print(\"Entry allowed\")\n    else:\n        print(\"ID required\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nEntry allowed\n```"}, {"t": "md", "s": "## 5️⃣ Comparison operators\n\n📘 **Concept**\nUse relational operators to compare values.\n\n🧠 **Use cases**\n- Threshold checks"}, {"t": "code", "s": "a = 5\nb = 10\nif a < b:\n    print(\"a is smaller than b\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\na is smaller than b\n```"}, {"t": "md", "s": "## 6️⃣ Logical operators\n\n📘 **Concept**\nCombine conditions using and/or/not.\n\n🧠 **Use cases**\n- Permission systems"}, {"t": "code", "s": "age = 25\ncountry = \"JP\"\nif age >= 18 and country == \"JP\":\n    print(\"Eligible\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nEligible\n```"}, {"t": "md", "s": "## 7️⃣ Membership test\n\n📘 **Concept**\nCheck if a value exists in a collection.\n\n🧠 **Use cases**\n- Whitelists"}, {"t": "code", "s": "color = \"red\"\nif color in [\"red\", \"blue\", \"green\"]:\n    print(\"Valid color\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nValid color\n```"}, {"t": "md", "s": "## 8️⃣ Truthy and falsy values\n\n📘 **Concept**\nNon-boolean values can act as conditions.\n\n🧠 **Use cases**\n- Empty checks"}, {"t": "code", "s": "items = []\nif not items:\n    print(\"List is empty\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nList is empty\n```"}, {"t": "md", "s": "## 9️⃣ Conditional expressions (ternary)\n\n📘 **Concept**\nOne-line if–else expression.\n\n🧠 **Use cases**\n- Simple decisions"}, {"t": "code", "s": "x = 7\nresult = \"Even\" if x % 2 == 0 else \"Odd\"\nprint(result)"}, {"t": "md", "s": "📤 **Output (example)**\n```\nOdd\n```"}, {"t": "md", "s": "## 🔟 Real-world example: Login check\n\n📘 **Concept**\nCombining multiple conditions.\n\n🧠 **Use cases**\n- Authentication logic"}, {"t": "code", "s": "username = \"admin\"\npassword = \"1234\"\nif username == \"admin\" and password == \"1234\":\n    print(\"Login successful\")\nelse:\n    print(\"Invalid credentials\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nLogin successful\n```"}, {"t": "md", "s": "## ✅ Final Notes\n\n- Conditions are evaluated top-down\n- Keep conditions readable\n- Avoid deep nesting when possible\n- Combine with loops for powerful logic"}]</script>
