<script type="application/json" id="nbdata">[{"t": "md", "s": "🧩 **Python Functions — Complete Study Notebook**\n\nThis notebook explains **functions** using:\n- 📘 Concept\n- 🧠 Real-world use cases\n- 💻 Executable code\n- 📤 Example output\n\nFunctions help you **reuse logic**, **organize code**, and **avoid repetition**."}, {"t": "md", "s": "## 1️⃣ Defining a simple function\n\n📘 **Concept**\nA function is defined using `def` and executed when called.\n\n🧠 **Use cases**\n- Code reuse\n- Logical grouping"}, {"t": "code", "s": "def greet():\n    print(\"Hello\")\n\ngreet()"}, {"t": "md", "s": "📤 **Output (example)**\n```\nHello\n```"}, {"t": "md", "s": "## 2️⃣ Function with parameters\n\n📘 **Concept**\nParameters allow functions to accept inputs.\n\n🧠 **Use cases**\n- Flexible logic\n- Data processing"}, {"t": "code", "s": "def greet(name):\n    print(\"Hello\", name)\n\ngreet(\"Aniket\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nHello Aniket\n```"}, {"t": "md", "s": "## 3️⃣ Function with return value\n\n📘 **Concept**\n`return` sends data back to the caller.\n\n🧠 **Use cases**\n- Calculations\n- Decision logic"}, {"t": "code", "s": "def add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n8\n```"}, {"t": "md", "s": "## 4️⃣ Default arguments\n\n📘 **Concept**\nDefault values are used if arguments are not provided.\n\n🧠 **Use cases**\n- Optional parameters"}, {"t": "code", "s": "def greet(name=\"Guest\"):\n    print(\"Hello\", name)\n\ngreet()\ngreet(\"Aniket\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nHello Guest\nHello Aniket\n```"}, {"t": "md", "s": "## 5️⃣ Keyword arguments\n\n📘 **Concept**\nArguments can be passed using parameter names.\n\n🧠 **Use cases**\n- Readable function calls"}, {"t": "code", "s": "def profile(name, age):\n    print(name, age)\n\nprofile(age=25, name=\"Aniket\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nAniket 25\n```"}, {"t": "md", "s": "## 6️⃣ Arbitrary positional arguments (*args)\n\n📘 **Concept**\nAccepts variable number of positional arguments.\n\n🧠 **Use cases**\n- Flexible APIs"}, {"t": "code", "s": "def total(*numbers):\n    print(sum(numbers))\n\ntotal(1, 2, 3, 4)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n10\n```"}, {"t": "md", "s": "## 7️⃣ Arbitrary keyword arguments (**kwargs)\n\n📘 **Concept**\nAccepts variable number of keyword arguments.\n\n🧠 **Use cases**\n- Configuration handling"}, {"t": "code", "s": "def show_info(**info):\n    for k, v in info.items():\n        print(k, v)\n\nshow_info(name=\"Aniket\", role=\"Engineer\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nname Aniket\nrole Engineer\n```"}, {"t": "md", "s": "## 8️⃣ Lambda (anonymous) functions\n\n📘 **Concept**\nSmall one-line functions.\n\n🧠 **Use cases**\n- Short transformations"}, {"t": "code", "s": "square = lambda x: x * x\nprint(square(5))"}, {"t": "md", "s": "📤 **Output (example)**\n```\n25\n```"}, {"t": "md", "s": "## 9️⃣ Function inside function\n\n📘 **Concept**\nFunctions can be nested.\n\n🧠 **Use cases**\n- Encapsulation"}, {"t": "code", "s": "def outer():\n    def inner():\n        print(\"Inside inner\")\n    inner()\n\nouter()"}, {"t": "md", "s": "📤 **Output (example)**\n```\nInside inner\n```"}, {"t": "md", "s": "## 🔟 Real-world example: Area calculator\n\n📘 **Concept**\nFunctions model real-world operations.\n\n🧠 **Use cases**\n- Engineering calculations"}, {"t": "code", "s": "def area_circle(radius):\n    pi = 3.14159\n    return pi * radius * radius\n\nprint(area_circle(5))"}, {"t": "md", "s": "📤 **Output (example)**\n```\n78.53975\n```"}, {"t": "md", "s": "## ✅ Final Notes\n\n- Functions reduce repetition\n- Use meaningful names\n- Prefer return over print for reusable logic\n- Functions are the foundation of modular programming"}]</script>
