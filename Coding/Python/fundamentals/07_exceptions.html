<script type="application/json" id="nbdata">[{"t": "md", "s": "🚨 **Python Exceptions & Error Handling — Complete Study Notebook**\n\nThis notebook explains how Python handles runtime errors using:\n- 📘 Concepts\n- 🧠 Practical use cases\n- 💻 Executable examples\n- 📤 Sample outputs\n\nExceptions help programs **fail safely** instead of crashing."}, {"t": "md", "s": "## 1️⃣ What is an exception?\n\n📘 **Concept**\nAn exception is a runtime error that disrupts normal execution.\n\n🧠 **Use cases**\n- Detect invalid input\n- Prevent crashes"}, {"t": "code", "s": "x = 10\ny = 0\ntry:\n    print(x / y)\nexcept ZeroDivisionError as e:\n    print(\"Error:\", e)"}, {"t": "md", "s": "📤 **Output (example)**\n```\nError: division by zero\n```"}, {"t": "md", "s": "## 2️⃣ Basic try–except\n\n📘 **Concept**\nUse `try` and `except` to catch errors.\n\n🧠 **Use cases**\n- Safe arithmetic"}, {"t": "code", "s": "try:\n    num = int(\"abc\")\nexcept ValueError:\n    print(\"Conversion failed\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nConversion failed\n```"}, {"t": "md", "s": "## 3️⃣ Catching multiple exceptions\n\n📘 **Concept**\nHandle different errors separately.\n\n🧠 **Use cases**\n- Robust input handling"}, {"t": "code", "s": "try:\n    x = int(\"abc\")\n    y = 10 / 0\nexcept ValueError:\n    print(\"Value error occurred\")\nexcept ZeroDivisionError:\n    print(\"Division by zero occurred\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nValue error occurred\n```"}, {"t": "md", "s": "## 4️⃣ Using else with try–except\n\n📘 **Concept**\n`else` runs if no exception occurs.\n\n🧠 **Use cases**\n- Clean success paths"}, {"t": "code", "s": "try:\n    x = int(\"5\")\nexcept ValueError:\n    print(\"Error\")\nelse:\n    print(\"Success:\", x)"}, {"t": "md", "s": "📤 **Output (example)**\n```\nSuccess: 5\n```"}, {"t": "md", "s": "## 5️⃣ Using finally\n\n📘 **Concept**\n`finally` always executes.\n\n🧠 **Use cases**\n- Resource cleanup"}, {"t": "code", "s": "try:\n    f = open(\"test.txt\", \"w\")\n    f.write(\"hello\")\nfinally:\n    f.close()\n    print(\"File closed\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nFile closed\n```"}, {"t": "md", "s": "## 6️⃣ Raising exceptions\n\n📘 **Concept**\nManually raise exceptions.\n\n🧠 **Use cases**\n- Validation"}, {"t": "code", "s": "age = -1\nif age < 0:\n    raise ValueError(\"Age cannot be negative\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nValueError: Age cannot be negative\n```"}, {"t": "md", "s": "## 7️⃣ Custom exceptions\n\n📘 **Concept**\nDefine your own exception types.\n\n🧠 **Use cases**\n- Domain-specific errors"}, {"t": "code", "s": "class InvalidSpeedError(Exception):\n    pass\n\nspeed = -20\nif speed < 0:\n    raise InvalidSpeedError(\"Speed cannot be negative\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\nInvalidSpeedError: Speed cannot be negative\n```"}, {"t": "md", "s": "## 8️⃣ try–except inside loop\n\n📘 **Concept**\nHandle errors per iteration.\n\n🧠 **Use cases**\n- Batch processing"}, {"t": "code", "s": "values = [\"10\", \"x\", \"5\"]\nfor v in values:\n    try:\n        print(int(v))\n    except ValueError:\n        print(\"Invalid:\", v)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n10\nInvalid: x\n5\n```"}, {"t": "md", "s": "## 9️⃣ Exception hierarchy\n\n📘 **Concept**\nExceptions inherit from `Exception`.\n\n🧠 **Use cases**\n- Generic error handling"}, {"t": "code", "s": "try:\n    x = 1 / 0\nexcept Exception as e:\n    print(type(e).__name__)"}, {"t": "md", "s": "📤 **Output (example)**\n```\nZeroDivisionError\n```"}, {"t": "md", "s": "## 🔟 Real-world example: Input validation\n\n📘 **Concept**\nCombine logic + exceptions.\n\n🧠 **Use cases**\n- User input"}, {"t": "code", "s": "def set_age(age):\n    if not isinstance(age, int):\n        raise TypeError(\"Age must be integer\")\n    if age < 0:\n        raise ValueError(\"Age cannot be negative\")\n    return age\n\ntry:\n    set_age(\"ten\")\nexcept Exception as e:\n    print(e)"}, {"t": "md", "s": "📤 **Output (example)**\n```\nAge must be integer\n```"}, {"t": "md", "s": "## ✅ Final Notes\n\n- Use exceptions for **unexpected errors**\n- Don’t overuse try–except\n- Be specific when catching exceptions\n- Exceptions make systems reliable & debuggable"}]</script>
