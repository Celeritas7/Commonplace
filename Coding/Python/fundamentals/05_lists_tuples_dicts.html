<script type="application/json" id="nbdata">[{"t": "md", "s": "📦 **Python Lists, Tuples & Dictionaries — Complete Study Notebook**\n\nThis notebook explains Python’s core data structures using:\n- 📘 Concept\n- 🧠 Real-world use cases\n- 💻 Executable code\n- 📤 Example output"}, {"t": "md", "s": "## 1️⃣ Lists — Basics\n\n📘 **Concept**\nLists are ordered, mutable collections.\n\n🧠 **Use cases**\n- Storing sequences\n- Dynamic data"}, {"t": "code", "s": "numbers = [1, 2, 3, 4]\nnumbers.append(5)\nnumbers"}, {"t": "md", "s": "📤 **Output (example)**\n```\n[1, 2, 3, 4, 5]\n```"}, {"t": "md", "s": "## 2️⃣ Lists — Indexing & slicing\n\n📘 **Concept**\nAccess elements using indices and slices.\n\n🧠 **Use cases**\n- Subsetting data"}, {"t": "code", "s": "numbers = [10, 20, 30, 40, 50]\nnumbers[1:4]"}, {"t": "md", "s": "📤 **Output (example)**\n```\n[20, 30, 40]\n```"}, {"t": "md", "s": "## 3️⃣ Lists — Looping\n\n📘 **Concept**\nLists are iterable.\n\n🧠 **Use cases**\n- Data processing"}, {"t": "code", "s": "colors = ['red', 'blue', 'green']\nfor c in colors:\n    print(c)"}, {"t": "md", "s": "📤 **Output (example)**\n```\nred\nblue\ngreen\n```"}, {"t": "md", "s": "## 4️⃣ Tuples — Basics\n\n📘 **Concept**\nTuples are ordered but immutable.\n\n🧠 **Use cases**\n- Fixed records\n- Coordinates"}, {"t": "code", "s": "point = (10, 20)\npoint"}, {"t": "md", "s": "📤 **Output (example)**\n```\n(10, 20)\n```"}, {"t": "md", "s": "## 5️⃣ Tuples — Unpacking\n\n📘 **Concept**\nMultiple assignment from tuples.\n\n🧠 **Use cases**\n- Returning multiple values"}, {"t": "code", "s": "x, y = (5, 7)\nx, y"}, {"t": "md", "s": "📤 **Output (example)**\n```\n(5, 7)\n```"}, {"t": "md", "s": "## 6️⃣ Dictionaries — Basics\n\n📘 **Concept**\nDictionaries store key–value pairs.\n\n🧠 **Use cases**\n- Structured data\n- Lookup tables"}, {"t": "code", "s": "student = {\"name\": \"Aniket\", \"age\": 25}\nstudent[\"name\"]"}, {"t": "md", "s": "📤 **Output (example)**\n```\n'Aniket'\n```"}, {"t": "md", "s": "## 7️⃣ Dictionaries — Adding & updating\n\n📘 **Concept**\nKeys can be added or updated.\n\n🧠 **Use cases**\n- Dynamic records"}, {"t": "code", "s": "student[\"city\"] = \"Tokyo\"\nstudent"}, {"t": "md", "s": "📤 **Output (example)**\n```\n{'name': 'Aniket', 'age': 25, 'city': 'Tokyo'}\n```"}, {"t": "md", "s": "## 8️⃣ Dictionaries — Looping\n\n📘 **Concept**\nIterate over keys and values.\n\n🧠 **Use cases**\n- Data inspection"}, {"t": "code", "s": "for k, v in student.items():\n    print(k, v)"}, {"t": "md", "s": "📤 **Output (example)**\n```\nname Aniket\nage 25\ncity Tokyo\n```"}, {"t": "md", "s": "## 9️⃣ Lists vs Tuples vs Dicts\n\n📘 **Concept**\nChoosing the right structure.\n\n🧠 **Use cases**\n- Performance\n- Safety"}, {"t": "code", "s": "type([]), type(()), type({})"}, {"t": "md", "s": "📤 **Output (example)**\n```\n(<class 'list'>, <class 'tuple'>, <class 'dict'>)\n```"}, {"t": "md", "s": "## 🔟 Real-world example: Inventory system\n\n📘 **Concept**\nCombining data structures.\n\n🧠 **Use cases**\n- Inventory\n- Configuration"}, {"t": "code", "s": "inventory = {\n    \"apple\": 10,\n    \"banana\": 5\n}\ninventory[\"apple\"] -= 2\ninventory"}, {"t": "md", "s": "📤 **Output (example)**\n```\n{'apple': 8, 'banana': 5}\n```"}, {"t": "md", "s": "## ✅ Final Notes\n\n- Lists → mutable, ordered\n- Tuples → immutable, ordered\n- Dictionaries → mutable, key–value\n- Choose structure based on mutability & access pattern"}]</script>
