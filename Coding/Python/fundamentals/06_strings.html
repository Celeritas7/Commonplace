<script type="application/json" id="nbdata">[{"t": "md", "s": "🔤 **Python Strings & Text Processing — Complete Study Notebook**\n\nThis notebook covers Python string handling using:\n- 📘 Concepts\n- 🧠 Practical use cases\n- 💻 Executable examples\n- 📤 Sample outputs\n\nStrings are **immutable sequences of characters**."}, {"t": "md", "s": "## 1️⃣ String creation & basics\n\n📘 **Concept**\nStrings can be created using single or double quotes.\n\n🧠 **Use cases**\n- Text storage\n- Labels"}, {"t": "code", "s": "text = \"Hello World\"\ntext"}, {"t": "md", "s": "📤 **Output (example)**\n```\n'Hello World'\n```"}, {"t": "md", "s": "## 2️⃣ Indexing & slicing\n\n📘 **Concept**\nStrings support indexing and slicing.\n\n🧠 **Use cases**\n- Substrings\n- Parsing"}, {"t": "code", "s": "text = \"Python\"\ntext[0], text[1:4]"}, {"t": "md", "s": "📤 **Output (example)**\n```\n('P', 'yth')\n```"}, {"t": "md", "s": "## 3️⃣ String concatenation\n\n📘 **Concept**\nStrings can be joined using `+`.\n\n🧠 **Use cases**\n- Message building"}, {"t": "code", "s": "first = \"Hello\"\nsecond = \"World\"\nfirst + \" \" + second"}, {"t": "md", "s": "📤 **Output (example)**\n```\n'Hello World'\n```"}, {"t": "md", "s": "## 4️⃣ String repetition\n\n📘 **Concept**\nRepeat strings using `*`.\n\n🧠 **Use cases**\n- Formatting"}, {"t": "code", "s": "\"ha\" * 3"}, {"t": "md", "s": "📤 **Output (example)**\n```\n'hahaha'\n```"}, {"t": "md", "s": "## 5️⃣ Common string methods\n\n📘 **Concept**\nBuilt-in methods modify or analyze strings.\n\n🧠 **Use cases**\n- Cleaning data"}, {"t": "code", "s": "text = \"  Python Rocks  \"\ntext.strip(), text.lower(), text.upper()"}, {"t": "md", "s": "📤 **Output (example)**\n```\n('Python Rocks', '  python rocks  ', '  PYTHON ROCKS  ')\n```"}, {"t": "md", "s": "## 6️⃣ Splitting strings\n\n📘 **Concept**\nSplit strings into lists.\n\n🧠 **Use cases**\n- Tokenization"}, {"t": "code", "s": "sentence = \"data science with python\"\nsentence.split()"}, {"t": "md", "s": "📤 **Output (example)**\n```\n['data', 'science', 'with', 'python']\n```"}, {"t": "md", "s": "## 7️⃣ Joining strings\n\n📘 **Concept**\nJoin list elements into a string.\n\n🧠 **Use cases**\n- CSV building"}, {"t": "code", "s": "words = ['data', 'science', 'python']\n\" \".join(words)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n'data science python'\n```"}, {"t": "md", "s": "## 8️⃣ Finding & replacing\n\n📘 **Concept**\nSearch and replace substrings.\n\n🧠 **Use cases**\n- Text correction"}, {"t": "code", "s": "text = \"I like Java\"\ntext.replace(\"Java\", \"Python\")"}, {"t": "md", "s": "📤 **Output (example)**\n```\n'I like Python'\n```"}, {"t": "md", "s": "## 9️⃣ String formatting (f-strings)\n\n📘 **Concept**\nEmbed variables inside strings.\n\n🧠 **Use cases**\n- Logging"}, {"t": "code", "s": "name = \"Aniket\"\nage = 25\nf\"My name is {name} and I am {age}\""}, {"t": "md", "s": "📤 **Output (example)**\n```\n'My name is Aniket and I am 25'\n```"}, {"t": "md", "s": "## 🔟 Real-world example: Word count\n\n📘 **Concept**\nBasic text analysis.\n\n🧠 **Use cases**\n- NLP preprocessing"}, {"t": "code", "s": "text = \"python is powerful and python is easy\"\nlen(text.split())"}, {"t": "md", "s": "📤 **Output (example)**\n```\n6\n```"}, {"t": "md", "s": "## ✅ Final Notes\n\n- Strings are immutable\n- Most operations return new strings\n- Use f-strings for clarity\n- Core skill for data & NLP tasks"}]</script>
