<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Random Module · Commonplace Python</title>
<link href="../../../_lib/fonts/gf-135340b0.css" rel="stylesheet" />
<link rel="stylesheet" href="../lib/random/fd.css?v=2">
<style>
.wrap{max-width:min(780px,100%);padding-top:0}
.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-mute);padding:18px 0 14px}
.crumb a{color:var(--ink-mute);text-decoration:none}.crumb a:hover{color:var(--green)}
.crumb .sep{color:var(--line)}.crumb .here{color:var(--ink)}
.sticky{position:sticky;top:0;z-index:6;background:rgba(236,238,228,.94);backdrop-filter:blur(7px);border-bottom:1px solid var(--line);margin:0 -20px 16px;padding:10px 20px 9px}
.sticky-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sticky .fname{font-size:13px;padding:2px 8px}
.beats{display:flex;gap:4px;margin-left:auto;flex:none}
.bd{width:30px;height:5px;border-radius:3px;background:var(--line)}
.bd.done{background:var(--green)}.bd.here{background:var(--brass)}
.grouprow{display:flex;align-items:center;gap:8px;margin:0 0 7px}
.grouprow .glab{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-mute);flex:none}
.grouprow .gln{flex:1;height:1px;background:var(--line-soft)}
.rail{margin-bottom:6px}
.stage{position:relative;padding-left:26px}
.stage::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:var(--line)}
.block{position:relative;margin-bottom:22px}
.block::before{content:"";position:absolute;left:-26px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.block.live::before{border-color:var(--brass);background:var(--brass);box-shadow:0 0 0 4px rgba(169,138,75,.16)}
.block.cleared::before{border-color:var(--green);background:var(--green)}
.block.shut{opacity:.42}.block.shut .drill{pointer-events:none}
.block-kick{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-mute);display:block;margin-bottom:7px;white-space:nowrap}
.block.live .block-kick{color:var(--brass)}.block.cleared .block-kick{color:var(--green)}
.shut-note{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-mute);margin:0}
.paper{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 17px 17px}
.gbadge{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:#fff;background:var(--green-dk);border-radius:4px;padding:3px 8px}
.gbadge.ap{background:var(--brass)}.gbadge.rc{background:var(--green)}
.fconcept sup{font-size:.7em}
.cav{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.6px;color:#6f8c7e;padding:0 14px 11px;line-height:1.5}
.donecard{background:var(--sage-soft);border:1px solid var(--sage);border-radius:10px;padding:13px 15px;font-style:italic;color:var(--green-dk);font-size:15.5px}
.donecard b{font-family:"JetBrains Mono",monospace;font-size:14px;font-style:normal}
.foot{display:flex;align-items:center;gap:9px;margin-top:4px}
.foot .sp{flex:1}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(18px);background:var(--green-deep);color:#eaf2ea;font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.6px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.colophon{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-mute)}
.colophon .motto{font-style:italic}
@media (max-width:600px){.stage{padding-left:20px}.stage::before{left:5px}.block::before{left:-20px;width:11px;height:11px}.ftitle{font-size:24px}.paper{padding:13px 14px 15px}.beats{margin-left:0;width:100%}.bd{flex:1;width:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="../index.html">Python</a><span class="sep">/</span><a href="../index.html">Fundamentals</a><span class="sep">/</span><span class="here">Random Module</span></div>

  <div class="sticky">
    <div class="sticky-in">
      <span class="rail-pos" id="pos"></span>
      <span class="fname" id="fname"></span>
      <div class="beats"><span class="bd" id="b0"></span><span class="bd" id="b1"></span><span class="bd" id="b2"></span><span class="bd" id="b3"></span></div>
    </div>
  </div>

  <div class="grouprow"><span class="glab" id="glab">Core</span><span class="gln"></span></div>
  <div class="rail"><div class="rail-dots" id="dots"></div></div>

  <div class="stage" id="stage"></div>

  <footer class="colophon">
    <span class="motto">“Learn it by running it.”</span>
    <span><a href="../index.html">← Fundamentals</a></span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script src="../lib/random/fd.js?v=2"></script>
<script src="../lib/py-kb-fix.js?v=2"></script>
<script src="../lib/random/pyrun.js?v=1"></script>
<script src="../lib/random/random-features.js?v=2"></script>
<script src="../lib/random/random-features-2.js?v=2"></script>
<script src="../lib/random/stepper.js?v=2"></script>
<script src="../lib/sw-register.js?v=1"></script>
</body>
</html>
