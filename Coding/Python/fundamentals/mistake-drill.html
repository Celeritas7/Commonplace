<!DOCTYPE html>

<title>Mistake Drill · Python · Commonplace</title>
<link href="../../../_lib/fonts/gf-a896b6d9.css" rel="stylesheet" />
<style>
:root{
  --paper:#eceee4; --card:#fbfcf6; --panel:#f4f5ec;
  --ink:#1a2820; --head:#234f3b; --green:#2f6b4f; --green2:#3c8362;
  --muted:#7a8c80; --line:#d2dacb; --line2:#e0e6d8; --softgreen:#7fa68b;
  --red:#b3261e; --red2:#9a2a1f; --redbg:#fbf3f0; --redline:#ecd9d2;
  --code-bg:#16352a; --code-fg:#d7e8dd;
  --serif:'EB Garamond',Georgia,serif; --disp:'Cormorant Garamond',serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;font-family:var(--serif);}
button{font-family:inherit;cursor:pointer}
.topnav{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--card);}
.topnav a{color:var(--muted);text-decoration:none;padding:5px 11px;border-radius:7px;}
.topnav a:hover{background:#e3efe0;color:var(--head);}
.topnav a.here{color:var(--head);background:#dde7dd;}
.auth{margin-left:auto;display:flex;align-items:center;gap:8px;}
.who{color:var(--head);font-weight:700;}
.auth input{font:inherit;font-size:12px;padding:5px 9px;border-radius:8px;border:1.5px solid var(--line);outline:none;background:#fff;color:var(--ink);min-width:150px;}
.auth input:focus{border-color:var(--green2);}
.authbtn{font-family:var(--mono);font-weight:700;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--card);color:var(--head);}
.authbtn.primary{background:var(--green);color:#fff;border-color:var(--green);}
.authbtn:disabled{opacity:.55;cursor:default;}
.wrap{max-width:880px;margin:0 auto;padding:30px 28px 100px;}

/* ---- header ---- */
.head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;}
.sec{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--green);}
.h1{font-family:var(--disp);font-weight:600;font-size:34px;line-height:1;letter-spacing:-.3px;margin:0;white-space:nowrap;}
.count{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--green);background:#dde7dd;border:1px solid var(--softgreen);border-radius:999px;padding:2px 9px;}
.rule{flex:1;height:1px;background:var(--line);transform:translateY(-5px);}
.intro{color:#41564a;font-size:16px;font-style:italic;margin:0 0 22px;max-width:680px;text-wrap:pretty;}

/* ---- mode toggle + start ---- */
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 26px;}
.toggle{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;}
.toggle button{font-family:var(--mono);font-size:12px;font-weight:700;border:none;background:transparent;color:var(--muted);padding:8px 14px;border-radius:7px;letter-spacing:.2px;}
.toggle button.on{background:var(--head);color:#fff;}
.modehint{font-size:14px;font-style:italic;color:var(--muted);}
.start{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.3px;background:var(--green);color:#fff;border:1px solid var(--green);border-radius:10px;padding:11px 22px;box-shadow:3px 3px 0 #cdd9ce;transition:transform .08s,box-shadow .08s;}
.start:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #cdd9ce;}
.start:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #cdd9ce;}
.start:disabled{opacity:.45;box-shadow:none;cursor:default;transform:none;}

/* ---- bank cards ---- */
.banklist{display:flex;flex-direction:column;gap:13px;}

/* ---- section index + groups (topic buckets) ---- */
.sections{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px;}
.sectionchip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--head);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;transition:background .12s,border-color .12s;}
.sectionchip:hover{background:var(--panel);border-color:var(--head);}
.sc-count{font-size:11px;color:#fff;background:var(--red);border-radius:20px;min-width:18px;text-align:center;padding:1px 6px;}
.secgroup{margin:0 0 22px;}
.secgroup-head{display:flex;align-items:baseline;gap:13px;margin:0 0 13px;cursor:pointer;user-select:none;}
.secgroup-num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--green);letter-spacing:.3px;white-space:nowrap;}
.secgroup-name{font-family:var(--disp);font-weight:600;font-size:27px;line-height:1;letter-spacing:-.3px;color:var(--head);white-space:nowrap;}
.secgroup-count{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--green);background:#dde7dd;border:1px solid var(--softgreen);border-radius:999px;padding:2px 9px;}
.secgroup-rule{flex:1;height:1px;background:var(--line);transform:translateY(-6px);}
.secgroup-caret{font-family:var(--mono);font-size:13px;color:var(--muted);transition:transform .15s;transform:translateY(-2px);}
.secgroup.collapsed .secgroup-caret{transform:translateY(-2px) rotate(-90deg);}
.secgroup.collapsed .banklist{display:none;}
.secgroup.collapsed .secgroup-drill{display:none;}
.secgroup-drill{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--green);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap;}
.secgroup-drill:hover{border-color:var(--green);background:var(--card);}
.sectionchip-active{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--head);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 9px;}
.mcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:15px 17px;}
.mcard-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.mcode{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--head);background:#dde7dd;border-radius:7px;padding:2px 8px;}
.mtitle{flex:1;min-width:160px;font-family:var(--disp);font-weight:600;font-size:21px;line-height:1.1;}
.mwhen{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;}
.reason{display:flex;align-items:flex-start;gap:9px;margin:11px 0 0;}
.reason-tag{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--red2);background:var(--redbg);border:1px solid var(--redline);border-radius:7px;padding:3px 8px;white-space:nowrap;margin-top:2px;}
.reason-txt{flex:1;font-size:15px;color:#41564a;text-wrap:pretty;}
.peeklabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:13px 0 5px;}
.peek{font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre;overflow:hidden;max-height:4.5em;position:relative;margin:0;padding:10px 13px;background:var(--code-bg);color:var(--code-fg);border-radius:9px;}
.peek::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.8em;background:linear-gradient(to bottom,rgba(22,53,42,0),var(--code-bg));}

/* ---- empty state ---- */
.empty{text-align:center;padding:60px 24px;}
.empty-mark{font-family:var(--disp);font-size:64px;line-height:1;color:var(--green2);}
.empty-h{font-family:var(--disp);font-weight:600;font-size:30px;margin:14px 0 6px;color:var(--head);}
.empty-p{font-size:16px;color:var(--muted);font-style:italic;max-width:420px;margin:0 auto;}
.statebox{font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--muted);background:rgba(251,252,246,.7);border:1px dashed var(--softgreen);border-radius:10px;padding:16px 18px;}

/* ---- drill screen ---- */
.drill-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.back{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;}
.back:hover{background:var(--panel);color:var(--head);}
.progress{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--green);}
.modechip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--head);border-radius:7px;padding:3px 9px;}
.drill-title{font-family:var(--disp);font-weight:600;font-size:30px;line-height:1.05;margin:0 0 4px;color:var(--head);}
.drill-prompt{font-size:16px;color:#41564a;margin:0 0 20px;text-wrap:pretty;}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;}
.block-head{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--panel);border-bottom:1px solid var(--line2);}
.block-head .lab{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
.block-head .lab.bad{color:var(--red2);}
.was-when{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);font-style:normal;}
.wascode{font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre;margin:0;padding:12px 14px;background:var(--code-bg);color:#e9c4be;overflow-x:auto;max-height:280px;}
.editlab{display:flex;align-items:center;gap:9px;margin:4px 0 7px;}
.editlab .lab{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--green);}
.editor{width:100%;min-height:260px;font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--code-fg);background:var(--code-bg);border:1px solid #2b5444;border-radius:11px;padding:13px 15px;resize:vertical;outline:none;tab-size:4;white-space:pre;overflow:auto;}
.editor:focus{border-color:var(--green2);}
.stdin-row{display:flex;flex-direction:column;gap:5px;margin:12px 0 4px;}
.stdin-row label{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
.stdin{width:100%;min-height:44px;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--ink);background:var(--card);border:1.5px dashed var(--line);border-radius:9px;padding:8px 11px;resize:vertical;outline:none;}
.stdin:focus{border-color:var(--green2);}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 0;}
.btn{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.2px;border-radius:10px;padding:11px 18px;border:1px solid var(--line);background:var(--card);color:var(--head);box-shadow:2px 2px 0 #cdd9ce;transition:transform .08s,box-shadow .08s;}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 #cdd9ce;}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 #cdd9ce;}
.btn.run{background:var(--green);color:#fff;border-color:var(--green);}
.btn.ghost{box-shadow:none;background:transparent;color:var(--muted);}
.btn.ghost:hover{color:var(--head);background:var(--panel);transform:none;}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none;}
.spacer{flex:1;}
.markbtn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:9px;padding:9px 13px;}
.markbtn:hover{color:var(--head);border-color:var(--softgreen);}
.outwrap{margin-top:16px;border-radius:11px;overflow:hidden;border:1px solid var(--line2);}
.outhead{display:flex;align-items:center;gap:8px;padding:8px 13px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.outhead.ok{background:rgba(47,107,79,.14);color:var(--head);}
.outhead.bad{background:rgba(190,40,30,.12);color:var(--red2);}
.outbody{font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;margin:0;padding:12px 14px;background:var(--code-bg);color:var(--code-fg);max-height:300px;overflow:auto;}
.outbody.err{color:#f0b9b1;}
.hintbox{margin-top:14px;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--softgreen);border-radius:10px;padding:12px 15px;font-size:15px;color:#41564a;text-wrap:pretty;}
.hintbox .hl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--green);display:block;margin-bottom:5px;}

/* ---- success ---- */
.success{text-align:center;padding:36px 24px 20px;}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:78px;height:78px;border-radius:14px;background:var(--green);color:#fff;font-size:40px;box-shadow:4px 4px 0 #cdd9ce;transform:rotate(-4deg);}
.success-h{font-family:var(--disp);font-weight:600;font-size:34px;margin:20px 0 4px;color:var(--head);}
.success-p{font-size:16px;color:var(--muted);font-style:italic;margin:0 0 8px;}
.answer-block{text-align:left;margin:24px auto 0;max-width:680px;}
.adv{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap;}
.advnote{font-family:var(--mono);font-size:11px;color:var(--muted);}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none !important;}
@media (max-width:560px){.start{margin-left:0;width:100%}.h1{font-size:28px}}
</style>
</head>

<script src="../../../_lib/supabase.js"></script>
<script>(function APP(){
  "use strict";
  var root = document.getElementById('root');

  /* ---------- Supabase (same project/keys as the other Python pages) ---------- */
  var SUPABASE_URL = "https://wylxvmkcrexwfpjpbhyy.supabase.co";
  var SUPABASE_KEY = "sb_publishable_e3pDOuxIdstaC7s0a680kQ_R10TrAyv";
  var SUBJECT = "python";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  /* ---------- state ---------- */
  var currentUser = null;
  var loading = false, loadErr = "";
  var BANK = [];            // unresolved mistakes (view models)
  var SOLUTIONS = {};       // exercise_id -> latest passing code (for Reveal)
  var mode = "spot";        // "spot" | "blank"
  var view = "bank";        // "bank" | "drill" | "done"
  var queue = [];           // ids being drilled, in order
  var qpos = 0;
  var activeSection = null;  // null = all sections; else only drill this topic
  var collapsedSections = {}; // section name -> true when collapsed
  var lastSolvedCode = "";  // code shown on success screen

  /* ---------- utils ---------- */
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function rel(ts){
    if(!ts) return '';
    var then=new Date(ts).getTime(), now=Date.now(), d=Math.max(0,now-then);
    var min=Math.round(d/6e4), hr=Math.round(d/36e5), day=Math.round(d/864e5);
    if(min<1) return 'just now';
    if(min<60) return min+(min===1?' min ago':' mins ago');
    if(hr<24) return hr+(hr===1?' hour ago':' hours ago');
    if(day<31) return day+(day===1?' day ago':' days ago');
    var mo=Math.round(day/30); if(mo<12) return mo+(mo===1?' month ago':' months ago');
    var yr=Math.round(day/365); return yr+(yr===1?' year ago':' years ago');
  }
  function longDate(ts){
    if(!ts) return '';
    try{ return new Date(ts).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); }
    catch(e){ return String(ts).slice(0,10); }
  }
  function firstSentence(s){
    if(!s) return '';
    var m=/^(.*?[.!?])(\s|$)/.exec(String(s).trim());
    return m? m[1] : String(s).trim();
  }

  /* ---------- auth pill (magic link) ---------- */
  function renderAuth(){
    var el=document.getElementById('auth'); if(!el) return;
    if(currentUser){
      el.innerHTML='<span class="who">'+esc(currentUser.email)+'</span><button class="authbtn" data-act="signout">Sign out</button>';
    }else{
      el.innerHTML='<input type="email" id="email" placeholder="you@email.com" autocomplete="email"><button class="authbtn primary" data-act="magic">Email me a link</button>';
    }
  }
  function sendMagicLink(){
    var inp=document.getElementById('email'); var email=(inp&&inp.value||'').trim(); if(!email) return;
    var btn=document.querySelector('[data-act="magic"]'); if(btn){btn.disabled=true;btn.textContent='Sending…';}
    sb.auth.signInWithOtp({ email:email, options:{ emailRedirectTo:window.location.href.split('#')[0] } })
      .then(function(res){ alert(res.error?('Error: '+res.error.message):'Check your inbox for the sign-in link.'); })
      .catch(function(e){ alert('Error: '+e.message); })
      .finally(function(){ if(btn){btn.disabled=false;btn.textContent='Email me a link';} });
  }

  /* ---------- data load ---------- */
  function loadData(){
    if(!currentUser){ BANK=[]; loading=false; loadErr=""; render(); return; }
    loading=true; loadErr=""; render();
    var p1=sb.from('commonplace_mistakes')
      .select('id, reason, resolved, created_at, exercise_id, attempt_id,'+
              'commonplace_exercises(id,title,prompt,expected_output,tags),'+
              'commonplace_attempts(code,stdout,stderr,created_at)')
      .eq('subject',SUBJECT).eq('resolved',false)
      .order('created_at',{ascending:false});
    var p2=sb.from('commonplace_attempts')
      .select('exercise_id,code,created_at')
      .eq('subject',SUBJECT).eq('passed',true)
      .order('created_at',{ascending:false});
    Promise.all([p1,p2]).then(function(r){
      loading=false;
      if(r[0].error){ loadErr=r[0].error.message; BANK=[]; render(); return; }
      SOLUTIONS={};
      (r[1].data||[]).forEach(function(a){ if(a.exercise_id && !SOLUTIONS[a.exercise_id]) SOLUTIONS[a.exercise_id]=a.code; });
      BANK=(r[0].data||[]).map(function(m){
        var ex=m.commonplace_exercises||{}, at=m.commonplace_attempts||{};
        return {
          id:m.id, exercise_id:m.exercise_id,
          title:ex.title||'Untitled exercise',
          prompt:ex.prompt||'',
          expected:ex.expected_output||'',
          section:sectionOf(ex.tags),
          reason:m.reason||'',
          mistakeAt:m.created_at,
          wrongCode:(at.code||'').replace(/\r\n/g,'\n'),
          wrongAt:at.created_at||m.created_at
        };
      }).filter(function(m){ return m.wrongCode || m.reason; });
      render();
    }).catch(function(e){ loading=false; loadErr=e.message; render(); });
  }

  /* ---------- Pyodide (lazy) ---------- */
  var pyReady=null;
  function ensurePyodide(){
    if(pyReady) return pyReady;
    pyReady=new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src='../../../_lib/pyodide/pyodide.js';
      s.onload=function(){ window.loadPyodide({indexURL:'../../../_lib/pyodide/'}).then(resolve,reject); };
      s.onerror=function(){ reject(new Error('Could not load the Python runtime.')); };
      document.head.appendChild(s);
    });
    return pyReady;
  }
  var HARNESS=[
    "import sys, io, builtins, traceback",
    "_out = io.StringIO()",
    "_old_out, _old_err = sys.stdout, sys.stderr",
    "sys.stdout = _out; sys.stderr = _out",
    "_it = iter(__stdin.split('\\n'))",
    "def _inp(p=''):",
    "    sys.stdout.write(str(p))",
    "    try: v = next(_it)",
    "    except StopIteration: v = ''",
    "    sys.stdout.write(v + '\\n')",
    "    return v",
    "builtins.input = _inp",
    "_err = ''",
    "try:",
    "    exec(compile(__code, '<your code>', 'exec'), {'__name__':'__main__','input':_inp})",
    "except SystemExit:",
    "    pass",
    "except BaseException:",
    "    _err = traceback.format_exc()",
    "finally:",
    "    sys.stdout = _old_out; sys.stderr = _old_err",
    "_result = {'out': _out.getvalue(), 'err': _err}"
  ].join("\n");

  function runPython(code, stdinText){
    return ensurePyodide().then(function(py){
      py.globals.set('__code', code);
      py.globals.set('__stdin', stdinText==null?'':String(stdinText));
      py.runPython(HARNESS);
      var res=py.globals.get('_result');
      var out, err;
      try{ out=res.get('out'); err=res.get('err'); }catch(e){ out=''; err=''; }
      if(res && res.destroy) res.destroy();
      return { out:out||'', err:err||'' };
    });
  }

  /* ---------- bank screen ---------- */
  // Curriculum section = first tag that isn't an import:* or topic:* marker
  // (matches the Practice page's grouping so both read the same way).
  function sectionOf(tags){
    if(!tags || !tags.length) return 'Unsorted';
    for(var i=0;i<tags.length;i++){
      var t=String(tags[i]||'');
      if(/^import:/i.test(t) || /^topic:/i.test(t)) continue;
      return t.trim()||'Unsorted';
    }
    return 'Unsorted';
  }
  // Fixed curriculum order so §I–§IV always line up with the Practice page.
  var CURRICULUM_ORDER=['Fundamentals','Data Libraries','100 Days (Angela Yu)','Warm-ups'];
  // Group BANK into [{name, items}] in curriculum order; unknown sections after, Unsorted last.
  function groupedBank(){
    var map={};
    BANK.forEach(function(m){ var s=m.section||'Unsorted'; (map[s]=map[s]||[]).push(m); });
    var names=Object.keys(map).sort(function(a,b){
      var ia=CURRICULUM_ORDER.indexOf(a), ib=CURRICULUM_ORDER.indexOf(b);
      if(a==='Unsorted') return 1; if(b==='Unsorted') return -1;
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1; if(ib!==-1) return 1;
      return a.localeCompare(b);
    });
    return names.map(function(n){ return {name:n, items:map[n]}; });
  }
  function itemsForSection(sec){
    return sec? BANK.filter(function(m){ return (m.section||'Unsorted')===sec; }) : BANK.slice();
  }
  // Roman numerals for the §-style section headers (1..30 is plenty).
  function roman(n){
    var map=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']], out='';
    for(var i=0;i<map.length;i++){ while(n>=map[i][0]){ out+=map[i][1]; n-=map[i][0]; } }
    return out;
  }
  function bankCardHtml(m){
    var peek=(m.wrongCode||'(no code captured)').split('\n').slice(0,6).join('\n');
    return '<div class="mcard">'
      +'<div class="mcard-top">'
        +'<span class="mtitle">'+esc(m.title)+'</span>'
        +'<span class="mwhen">added '+esc(rel(m.mistakeAt))+'</span>'
      +'</div>'
      +'<div class="reason"><span class="reason-tag">why it failed</span>'
        +'<span class="reason-txt">'+esc(firstSentence(m.reason)||'Marked for review.')+'</span></div>'
      +'<div class="peeklabel">You wrote</div>'
      +'<pre class="peek">'+esc(peek)+'</pre>'
    +'</div>';
  }
  function bankHtml(){
    var n=BANK.length;
    var groups=groupedBank();
    var html='<div class="head"><span class="sec">§ Review</span>'
      +'<h1 class="h1">Mistake Drill</h1>'
      +'<span class="count">'+(n? n+' to review':'clear')+'</span>'
      +'<span class="rule"></span></div>'
      +'<p class="intro">Your real wrong attempts, pulled from the bank and grouped by topic. Drill one section at a time, or all of them.</p>';
    if(!n){
      html+='<div class="empty"><div class="empty-mark">◯</div>'
        +'<div class="empty-h">The bank is clear.</div>'
        +'<p class="empty-p">No unresolved Python mistakes. Go practise — anything you get wrong will land here, ready to drill.</p></div>';
      root.innerHTML=html; return;
    }
    html+='<div class="controls">'
      +'<div class="toggle">'
        +'<button data-act="mode" data-mode="spot" class="'+(mode==='spot'?'on':'')+'">Spot the bug</button>'
        +'<button data-act="mode" data-mode="blank" class="'+(mode==='blank'?'on':'')+'">Blank redo</button>'
      +'</div>'
      +'<span class="modehint">'+(mode==='spot'?'See your old code and fix it in place.':'Start from an empty editor — no peeking.')+'</span>'
      +'<button class="start" data-act="start">Drill all · '+n+' →</button>'
    +'</div>';
    // section index chips
    html+='<div class="sections">';
    groups.forEach(function(g){
      html+='<button class="sectionchip" data-act="start-section" data-section="'+esc(g.name)+'">'
        +'<span class="sc-name">'+esc(g.name)+'</span>'
        +'<span class="sc-count">'+g.items.length+'</span></button>';
    });
    html+='</div>';
    // grouped lists, rendered as §-numbered collapsible sections
    groups.forEach(function(g,gi){
      var collapsed = !!collapsedSections[g.name];
      html+='<div class="secgroup'+(collapsed?' collapsed':'')+'">'
        +'<div class="secgroup-head" data-act="toggle-section" data-section="'+esc(g.name)+'">'
          +'<span class="secgroup-num">§ '+roman(gi+1)+'</span>'
          +'<span class="secgroup-name">'+esc(g.name)+'</span>'
          +'<span class="secgroup-count">'+g.items.length+'</span>'
          +'<span class="secgroup-rule"></span>'
          +'<button class="secgroup-drill" data-act="start-section" data-section="'+esc(g.name)+'">Drill this section →</button>'
          +'<span class="secgroup-caret">▾</span>'
        +'</div>'
        +'<div class="banklist">'+g.items.map(bankCardHtml).join('')+'</div>'
      +'</div>';
    });
    root.innerHTML=html;
  }

  /* ---------- drill screen ---------- */
  function currentItem(){ var id=queue[qpos]; for(var i=0;i<BANK.length;i++) if(BANK[i].id===id) return BANK[i]; return null; }
  function drillHtml(){
    var m=currentItem();
    if(!m){ view='bank'; bankHtml(); return; }
    var total=queue.length;
    var prefill=mode==='spot'? m.wrongCode : '';
    var html='<div class="drill-bar">'
      +'<button class="back" data-act="exit">← Bank</button>'
      +'<span class="modechip">'+(mode==='spot'?'Spot the bug':'Blank redo')+'</span>'
      +(activeSection?'<span class="sectionchip-active">'+esc(activeSection)+'</span>':'')
      +'<span class="progress">'+(qpos+1)+' / '+total+'</span></div>'
      +'<h2 class="drill-title">'+esc(m.title)+'</h2>'
      +'<p class="drill-prompt">'+esc(m.prompt|| 'Re-solve this one correctly, then run to check.')+'</p>';

    if(mode==='spot'){
      html+='<div class="block"><div class="block-head"><span class="lab bad">✕ You wrote this</span>'
        +'<span class="was-when">on '+esc(longDate(m.wrongAt))+'</span></div>'
        +'<pre class="wascode">'+esc(m.wrongCode||'(no code captured)')+'</pre></div>';
    }
    html+='<div class="editlab"><span class="lab">'+(mode==='spot'?'✎ Fix it here':'✎ Your solution')+'</span></div>'
      +'<textarea class="editor" id="editor" spellcheck="false">'+esc(prefill)+'</textarea>'
      +'<div class="stdin-row"><label for="stdin">Inputs for input() — one per line (optional)</label>'
      +'<textarea class="stdin" id="stdin" spellcheck="false" placeholder="e.g. each line is one response your program reads"></textarea></div>'
      +'<div class="actions">'
        +'<button class="btn run" data-act="run">▷ Run &amp; Check</button>'
        +'<button class="btn" data-act="hint">Hint</button>'
        +'<button class="btn ghost" data-act="reveal">Reveal answer</button>'
        +'<span class="spacer"></span>'
        +'<button class="markbtn" data-act="resolve">Mark as fixed ✓</button>'
      +'</div>'
      +'<div id="hintslot"></div>'
      +'<div id="outslot"></div>';
    root.innerHTML=html;
  }

  function setOut(kind,label,body,isErr){
    var el=document.getElementById('outslot'); if(!el) return;
    el.innerHTML='<div class="outwrap"><div class="outhead '+kind+'">'+esc(label)+'</div>'
      +'<pre class="outbody'+(isErr?' err':'')+'">'+esc(body||'(no output)')+'</pre></div>';
  }
  function doRun(){
    var m=currentItem(); if(!m) return;
    var code=(document.getElementById('editor')||{}).value||'';
    var stdin=(document.getElementById('stdin')||{}).value||'';
    var btn=document.querySelector('[data-act="run"]');
    if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>Running…'; }
    runPython(code, stdin).then(function(r){
      if(btn){ btn.disabled=false; btn.innerHTML='▷ Run &amp; Check'; }
      var hasExpected = !!(m.expected && m.expected.trim());
      var ok;
      if(hasExpected){ ok = !r.err && r.out.trim()===m.expected.trim(); }
      else { ok = !r.err; }
      if(r.err){
        setOut('bad','✕ Traceback — not fixed yet', r.err, true);
      } else if(hasExpected && !ok){
        setOut('bad','✕ Output doesn\u2019t match expected', 'Expected:\n'+m.expected+'\n\nGot:\n'+r.out, false);
      } else {
        setOut('ok','✓ Ran clean — looks fixed', r.out||'(ran with no output)', false);
        markResolved(code, r.out);
      }
    }).catch(function(e){
      if(btn){ btn.disabled=false; btn.innerHTML='▷ Run &amp; Check'; }
      setOut('bad','✕ Could not run', String(e&&e.message||e), true);
    });
  }
  function showHint(){
    var m=currentItem(); if(!m) return;
    var el=document.getElementById('hintslot'); if(!el) return;
    var h=firstSentence(m.reason)||'Read your code line by line and trace one run by hand.';
    el.innerHTML='<div class="hintbox"><span class="hl">Hint</span>'+esc(h)+'</div>';
  }
  function showReveal(){
    var m=currentItem(); if(!m) return;
    var sol=SOLUTIONS[m.exercise_id];
    var body, lab;
    if(sol){ body=sol.replace(/\r\n/g,'\n'); lab='✓ A version of yours that passed'; }
    else if(m.expected && m.expected.trim()){ body='Expected output:\n\n'+m.expected; lab='Expected output'; }
    else { body=m.reason||'No stored solution for this one — use the hint and the full diagnosis above.'; lab='Full diagnosis'; }
    var el=document.getElementById('outslot'); if(!el) return;
    el.innerHTML='<div class="outwrap"><div class="outhead ok">'+esc(lab)+'</div>'
      +'<pre class="outbody">'+esc(body)+'</pre></div>'
      +(m.reason?'<div class="hintbox"><span class="hl">What went wrong originally</span>'+esc(m.reason)+'</div>':'');
  }

  /* ---------- resolve + advance ---------- */
  function markResolved(code, out){
    var m=currentItem(); if(!m) return;
    lastSolvedCode = SOLUTIONS[m.exercise_id] || code || '';
    // 1) log a passing attempt; 2) flip the mistake to resolved
    var attemptRow={ subject:SUBJECT, exercise_id:m.exercise_id, code:code||'', stdout:out||'', passed:true };
    sb.from('commonplace_attempts').insert(attemptRow).then(function(){
      return sb.from('commonplace_mistakes').update({ resolved:true, resolved_at:new Date().toISOString() }).eq('id', m.id);
    }).then(function(){
      // drop it from the in-memory bank so the count + list update
      BANK=BANK.filter(function(x){ return x.id!==m.id; });
      view='done'; doneHtml(); startAutoAdvance();
    }).catch(function(e){
      // even if the write fails, show success but warn
      view='done'; doneHtml(true, e.message); startAutoAdvance();
    });
  }
  function manualResolve(){
    var code=(document.getElementById('editor')||{}).value||'';
    markResolved(code, '');
  }

  /* ---------- success screen ---------- */
  var advTimer=null, advLeft=0;
  function remainingInQueue(){
    var rest=[]; for(var i=qpos+1;i<queue.length;i++){ var id=queue[i]; if(BANK.some(function(x){return x.id===id;})) rest.push(id); }
    return rest;
  }
  function doneHtml(warn, warnMsg){
    var rest=remainingInQueue();
    var html='<div class="success"><div class="stamp">✓</div>'
      +'<div class="success-h">Fixed.</div>'
      +'<p class="success-p">'+(rest.length? 'Marked resolved and cleared from your bank.' : 'That was the last one. Your bank is clear.')+'</p>';
    if(warn) html+='<p class="success-p" style="color:var(--red2)">Saved locally for this session, but the cloud write failed: '+esc(warnMsg||'')+'</p>';
    html+='</div>';
    if(lastSolvedCode){
      html+='<div class="answer-block"><div class="block"><div class="block-head"><span class="lab">✓ The correct answer</span></div>'
        +'<pre class="wascode" style="color:var(--code-fg)">'+esc(lastSolvedCode)+'</pre></div></div>';
    }
    html+='<div class="adv">';
    if(rest.length){
      html+='<button class="start" data-act="next" style="margin:0">Next mistake →</button>'
        +'<span class="advnote" id="advnote"><span class="spin"></span>auto-advancing in '+advLeft+'s…</span>';
    }else{
      html+='<button class="start" data-act="exit" style="margin:0">Back to bank</button>';
    }
    html+='</div>';
    root.innerHTML=html;
  }
  function startAutoAdvance(){
    clearInterval(advTimer);
    if(!remainingInQueue().length) return;
    advLeft=4;
    var note=document.getElementById('advnote');
    advTimer=setInterval(function(){
      advLeft--;
      var n=document.getElementById('advnote');
      if(n) n.innerHTML='<span class="spin"></span>auto-advancing in '+advLeft+'s…';
      if(advLeft<=0){ clearInterval(advTimer); goNext(); }
    },1000);
  }
  function goNext(){
    clearInterval(advTimer);
    var rest=remainingInQueue();
    if(!rest.length){ view='bank'; bankHtml(); return; }
    // move qpos to the next still-unresolved item
    while(qpos<queue.length){ qpos++; var id=queue[qpos]; if(id && BANK.some(function(x){return x.id===id;})) break; }
    if(qpos>=queue.length || !currentItem()){ view='bank'; bankHtml(); return; }
    view='drill'; drillHtml();
  }
  function startDrill(){
    if(!BANK.length) return;
    activeSection=null;
    queue=BANK.map(function(m){ return m.id; });
    qpos=0; view='drill'; drillHtml();
  }
  function startSection(sec){
    var items=itemsForSection(sec);
    if(!items.length) return;
    activeSection=sec;
    queue=items.map(function(m){ return m.id; });
    qpos=0; view='drill'; drillHtml();
  }
  function exitDrill(){ clearInterval(advTimer); view='bank'; bankHtml(); }

  /* ---------- top-level render ---------- */
  function render(){
    renderAuth();
    if(!currentUser){ root.innerHTML='<div class="head"><span class="sec">§ Review</span><h1 class="h1">Mistake Drill</h1><span class="rule"></span></div>'
      +'<div class="statebox">Sign in (top-right) to load your Python mistake bank from Supabase.</div>'; return; }
    if(loading){ root.innerHTML='<div class="head"><span class="sec">§ Review</span><h1 class="h1">Mistake Drill</h1><span class="rule"></span></div><div class="statebox">Loading your mistake bank…</div>'; return; }
    if(loadErr){ root.innerHTML='<div class="head"><span class="sec">§ Review</span><h1 class="h1">Mistake Drill</h1><span class="rule"></span></div><div class="statebox">Could not load: '+esc(loadErr)+'</div>'; return; }
    if(view==='drill') drillHtml();
    else if(view==='done') doneHtml();
    else bankHtml();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    var t=e.target.closest? e.target.closest('[data-act]'):null; if(!t) return;
    var act=t.getAttribute('data-act');
    if(act==='signout'){ sb.auth.signOut(); }
    else if(act==='magic'){ sendMagicLink(); }
    else if(act==='mode'){ mode=t.getAttribute('data-mode'); bankHtml(); }
    else if(act==='start'){ startDrill(); }
    else if(act==='start-section'){ e.stopPropagation(); startSection(t.getAttribute('data-section')); }
    else if(act==='toggle-section'){ var s=t.getAttribute('data-section'); collapsedSections[s]=!collapsedSections[s]; bankHtml(); }
    else if(act==='exit'){ exitDrill(); }
    else if(act==='run'){ doRun(); }
    else if(act==='hint'){ showHint(); }
    else if(act==='reveal'){ showReveal(); }
    else if(act==='resolve'){ manualResolve(); }
    else if(act==='next'){ goNext(); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target && e.target.id==='email'){ sendMagicLink(); return; }
    // ⌘/Ctrl-Enter to Run while drilling
    if((e.metaKey||e.ctrlKey) && e.key==='Enter' && view==='drill'){ e.preventDefault(); doRun(); }
  });
  // allow Tab to insert spaces inside the editor
  document.addEventListener('keydown', function(e){
    if(e.key==='Tab' && e.target && e.target.id==='editor'){
      e.preventDefault();
      var ta=e.target, s=ta.selectionStart, en=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en);
      ta.selectionStart=ta.selectionEnd=s+4;
    }
  });

  renderAuth();
  sb.auth.onAuthStateChange(function(_e,session){ currentUser=session?session.user:null; loadData(); });
  sb.auth.getSession().then(function(res){ currentUser=res.data.session?res.data.session.user:null; loadData(); });
  render();
})();</script>
