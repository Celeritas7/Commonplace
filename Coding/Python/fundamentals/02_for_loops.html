<script type="application/json" id="nbdata">[{"t": "md", "s": "# 🔁 Python `for` Loop — Complete Study & Practice Notebook\n\nThis notebook explains **for-loops** using:\n- 📘 Concept\n- 🧠 Real-world use cases\n- 💻 Executable code\n- 📤 Example output\n\nYou can run each cell and modify it freely."}, {"t": "md", "s": "## 1️⃣ Basic for loop\n\n📘 **Concept**\nA `for` loop iterates over a sequence one element at a time.\n\n🧠 **Use cases**\n- Iterating over lists\n- Processing collections\n- Repeating fixed actions"}, {"t": "code", "s": "for i in range(5):\n    print(i)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n0\n1\n2\n3\n4\n```"}, {"t": "md", "s": "## 2️⃣ Loop with custom start and end\n\n📘 **Concept**\n`range(start, stop)` allows control over loop bounds.\n\n🧠 **Use cases**\n- Index-based operations\n- Numbered reports"}, {"t": "code", "s": "for i in range(3, 8):\n    print(i)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n3\n4\n5\n6\n7\n```"}, {"t": "md", "s": "## 3️⃣ Loop with step size\n\n📘 **Concept**\n`range(start, stop, step)` skips values.\n\n🧠 **Use cases**\n- Even / odd numbers\n- Sampling sequences"}, {"t": "code", "s": "for i in range(0, 11, 2):\n    print(i)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n0\n2\n4\n6\n8\n10\n```"}, {"t": "md", "s": "## 4️⃣ Looping over a list\n\n📘 **Concept**\nYou can iterate directly over list elements.\n\n🧠 **Use cases**\n- Data processing\n- Batch operations"}, {"t": "code", "s": "colors = ['red', 'blue', 'green']\nfor color in colors:\n    print(color)"}, {"t": "md", "s": "📤 **Output (example)**\n```\nred\nblue\ngreen\n```"}, {"t": "md", "s": "## 5️⃣ Loop with index (enumerate)\n\n📘 **Concept**\n`enumerate()` gives index + value.\n\n🧠 **Use cases**\n- Position-aware loops\n- Debugging"}, {"t": "code", "s": "colors = ['red', 'blue', 'green']\nfor i, color in enumerate(colors):\n    print(i, color)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n0 red\n1 blue\n2 green\n```"}, {"t": "md", "s": "## 6️⃣ Loop over a string\n\n📘 **Concept**\nStrings are iterable character-by-character.\n\n🧠 **Use cases**\n- Text processing\n- Validation"}, {"t": "code", "s": "word = \"loop\"\nfor ch in word:\n    print(ch)"}, {"t": "md", "s": "📤 **Output (example)**\n```\nl\no\no\np\n```"}, {"t": "md", "s": "## 7️⃣ Nested for loops\n\n📘 **Concept**\nLoops inside loops.\n\n🧠 **Use cases**\n- Matrix processing\n- Pattern generation"}, {"t": "code", "s": "for i in range(1, 4):\n    for j in range(1, 4):\n        print(i, j)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n1 1\n1 2\n1 3\n2 1\n2 2\n2 3\n3 1\n3 2\n3 3\n```"}, {"t": "md", "s": "## 8️⃣ Using break in for loop\n\n📘 **Concept**\n`break` exits the loop early.\n\n🧠 **Use cases**\n- Search\n- Early termination"}, {"t": "code", "s": "for i in range(10):\n    if i == 5:\n        break\n    print(i)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n0\n1\n2\n3\n4\n```"}, {"t": "md", "s": "## 9️⃣ Using continue in for loop\n\n📘 **Concept**\n`continue` skips current iteration.\n\n🧠 **Use cases**\n- Filtering\n- Skipping invalid data"}, {"t": "code", "s": "for i in range(6):\n    if i == 3:\n        continue\n    print(i)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n0\n1\n2\n4\n5\n```"}, {"t": "md", "s": "## 🔟 Real-world example: Sum of numbers\n\n📘 **Concept**\nUsing loops for accumulation.\n\n🧠 **Use cases**\n- Statistics\n- Aggregation"}, {"t": "code", "s": "total = 0\nfor i in range(1, 6):\n    total += i\nprint(total)"}, {"t": "md", "s": "📤 **Output (example)**\n```\n15\n```"}, {"t": "md", "s": "## ✅ Final Notes\n\n- `for` loops are **deterministic**\n- Prefer iterating over objects directly\n- Combine with `if`, `break`, `continue`\n- Foundation for data science, ML, automation"}]</script>
