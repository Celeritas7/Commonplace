<script type="application/json" id="nbdata">[{"t": "md", "s": "# For loops\n\nPractice ten loop patterns with editable code and clear examples. Choose a section below, or open the experiment linked from Lesson 0.3.\n\n[Start with a basic loop](#np-u1) · [Lesson 0.3: run a cell twice](#np-u12)"}, {"t": "md", "s": "## Basic for loop\n\n #### Concept\nA `for` loop iterates over a sequence one element at a time.\n\n #### When to use it\n- Iterating over lists\n- Processing collections\n- Repeating fixed actions"}, {"t": "code", "s": "for i in range(5):\n    print(i)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\n0\n1\n2\n3\n4\n```\n\n</details>"}, {"t": "md", "s": "## Loop with custom start and end\n\n #### Concept\n`range(start, stop)` allows control over loop bounds.\n\n #### When to use it\n- Index-based operations\n- Numbered reports"}, {"t": "code", "s": "for i in range(3, 8):\n    print(i)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\n3\n4\n5\n6\n7\n```\n\n</details>"}, {"t": "md", "s": "## Loop with step size\n\n #### Concept\n`range(start, stop, step)` skips values.\n\n #### When to use it\n- Even / odd numbers\n- Sampling sequences"}, {"t": "code", "s": "for i in range(0, 11, 2):\n    print(i)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\n0\n2\n4\n6\n8\n10\n```\n\n</details>"}, {"t": "md", "s": "## Looping over a list\n\n #### Concept\nYou can iterate directly over list elements.\n\n #### When to use it\n- Data processing\n- Batch operations"}, {"t": "code", "s": "colors = ['red', 'blue', 'green']\nfor color in colors:\n    print(color)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\nred\nblue\ngreen\n```\n\n</details>"}, {"t": "md", "s": "## Loop with index (enumerate)\n\n #### Concept\n`enumerate()` gives index + value.\n\n #### When to use it\n- Position-aware loops\n- Debugging"}, {"t": "code", "s": "colors = ['red', 'blue', 'green']\nfor i, color in enumerate(colors):\n    print(i, color)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\n0 red\n1 blue\n2 green\n```\n\n</details>"}, {"t": "md", "s": "## Loop over a string\n\n #### Concept\nStrings are iterable character-by-character.\n\n #### When to use it\n- Text processing\n- Validation"}, {"t": "code", "s": "word = \"loop\"\nfor ch in word:\n    print(ch)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\nl\no\no\np\n```\n\n</details>"}, {"t": "md", "s": "## Nested for loops\n\n #### Concept\nLoops inside loops.\n\n #### When to use it\n- Matrix processing\n- Pattern generation"}, {"t": "code", "s": "for i in range(1, 4):\n    for j in range(1, 4):\n        print(i, j)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\n1 1\n1 2\n1 3\n2 1\n2 2\n2 3\n3 1\n3 2\n3 3\n```\n\n</details>"}, {"t": "md", "s": "## Using break in for loop\n\n #### Concept\n`break` exits the loop early.\n\n #### When to use it\n- Search\n- Early termination"}, {"t": "code", "s": "for i in range(10):\n    if i == 5:\n        break\n    print(i)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\n0\n1\n2\n3\n4\n```\n\n</details>"}, {"t": "md", "s": "## Using continue in for loop\n\n #### Concept\n`continue` skips current iteration.\n\n #### When to use it\n- Filtering\n- Skipping invalid data"}, {"t": "code", "s": "for i in range(6):\n    if i == 3:\n        continue\n    print(i)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\n0\n1\n2\n4\n5\n```\n\n</details>"}, {"t": "md", "s": "## Real-world example: Sum of numbers\n\n #### Concept\nUsing loops for accumulation.\n\n #### When to use it\n- Statistics\n- Aggregation"}, {"t": "code", "s": "total = 0\nfor i in range(1, 6):\n    total += i\nprint(total)"}, {"t": "md", "s": "<details><summary>Expected output</summary>\n\n```\n15\n```\n\n</details>"}, {"t": "md", "s": "## Final Notes\n\n- `for` loops are **deterministic**\n- Prefer iterating over objects directly\n- Combine with `if`, `break`, `continue`\n- Foundation for data science, ML, automation"}, {"t": "md", "s": "## Lesson 0.3 · Run a cell twice\n\nThis is the exact experiment from **Script, REPL, notebook**. The two cells share one Python session.\n\n1. Run **Cell 11** once to set the counter to zero.\n2. Run **Cell 12** once. The output should be **55**.\n3. Run **Cell 12** again, without running Cell 11. The output should now be **110**.\n4. To start over, run Cell 11 again.\n\n#### Cell 11 · Initialize once"}, {"t": "code", "s": "lesson03_total = 0\nprint(lesson03_total)"}, {"t": "md", "s": "#### Cell 12 · Run this cell twice\n\nThe loop adds 55 to the current total each time. It does not reset the counter."}, {"t": "code", "s": "for n in range(1, 11):\n    lesson03_total += n\nprint(lesson03_total)"}, {"t": "md", "s": "**Why it changes:** a notebook remembers variables between runs. Running the initialization cell again sets the counter back to zero. **Run all** runs each cell once; use the individual Run buttons for this experiment.\n\n[Back to Lesson 0.3](../lessons/Py_Lesson_0_3.html#s4)"}]</script>
