<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter · Classical ML</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<style>
:root{--bg:#0a0d15;--bg-2:#0d1320;--panel:#111726;--panel-2:#0e1422;--panel-hi:#161d2f;--ink:#e9edf6;--ink-soft:#aeb8cc;--ink-mute:#6f7a92;--ink-faint:#515b72;--rule:#222b3e;--rule-soft:#19212f;--cyan:#5fd0e6;--coral:#e07a5a;--green:#5fd0a0;--solar:#f0c46a;--acc:#5fd0e6}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"EB Garamond",Georgia,serif;font-size:17px}
body{background-image:radial-gradient(1100px 620px at 10% -8%,color-mix(in srgb,var(--acc) 7%,transparent),transparent 60%),radial-gradient(900px 560px at 96% 2%,rgba(224,106,212,.04),transparent 62%);min-height:100vh}
a{color:var(--cyan);text-decoration:none}a:hover{color:#86ddec}
.mono{font-family:"JetBrains Mono",monospace}
.wrap{max-width:1060px;margin:0 auto;padding:0 26px 90px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 14px;border-bottom:1px solid var(--rule-soft)}
.crumb{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint);display:flex;gap:10px;flex-wrap:wrap}
.crumb b{color:var(--acc);font-weight:500}
.topr{display:flex;align-items:center;gap:14px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase}
.kpill{display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--rule);border-radius:20px;color:var(--ink-mute);white-space:nowrap}
.kdot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
.kpill.is-boot .kdot{background:var(--solar);animation:pulse 1s infinite}
.kpill.is-ready .kdot{background:var(--green)}
.kpill.is-busy .kdot{background:var(--acc);animation:pulse .6s infinite}
.kpill.is-err .kdot{background:var(--coral)}
@keyframes pulse{50%{opacity:.3}}
/* hero */
.hero{padding:34px 0 10px}
.kick{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--ink-mute)}
.kick em{color:var(--acc);font-style:normal}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:46px;line-height:1.02;margin:10px 0 8px;letter-spacing:-.5px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero h1 .chip{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:500;letter-spacing:.5px;color:var(--bg);background:var(--acc);border-radius:8px;padding:6px 13px;transform:translateY(3px)}
.blurb{font-style:italic;color:var(--ink-soft);max-width:640px;margin:2px 0 14px;line-height:1.5}
.meta{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1px;color:var(--ink-faint)}
.meta b{color:var(--ink-mute);font-weight:500}
/* rail */
.rail{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 84%,transparent);padding:14px 0 6px;margin-top:16px}
.railin{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.railin::-webkit-scrollbar{height:7px}
.railin::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
.sec{flex:none;align-self:center;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1.6px;color:var(--acc);padding:0 6px 0 10px;text-transform:uppercase;white-space:nowrap}
.tick{flex:none;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2px;color:var(--ink-mute);background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:7px 11px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:border-color .15s,color .15s}
.tick:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--rule));color:var(--ink-soft)}
.tick.is-cur{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 9%,var(--panel-2))}
.tick.is-ran::before{content:"✓ ";color:var(--green)}
.tick.is-md{opacity:.75;font-style:italic;font-family:"EB Garamond",serif;font-size:13px}
/* stage nav */
.stage{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0 16px}
.navb{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-mute);background:var(--panel-2);border:1px solid var(--rule);border-radius:9px;padding:9px 16px;cursor:pointer;transition:all .15s;white-space:nowrap}
.navb:hover:not(:disabled){border-color:var(--acc);color:var(--ink)}
.navb:disabled{opacity:.35;cursor:default}
.where{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1px;color:var(--ink-mute);text-align:center;white-space:nowrap}
.stgr{display:flex;gap:8px}
.pgcell{margin:0 0 30px}
.pgcell .plate-code pre.static{margin:0;padding:16px 20px;font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.6;color:#dde3ef;overflow-x:auto;white-space:pre}
.where b{color:var(--acc);font-weight:500}
/* markdown plate */
.plate-md{background:color-mix(in srgb,var(--panel) 72%,transparent);border:1px solid var(--rule-soft);border-radius:14px;padding:30px 38px 34px;line-height:1.62}
.plate-md h1,.plate-md h2,.plate-md h3,.plate-md h4{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:-.3px;color:#f3f6fc;line-height:1.1}
.plate-md h1{font-size:2.1em;margin:.1em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--rule)}
.plate-md h1::first-letter{color:var(--acc)}
.plate-md h2{font-size:1.6em;margin:.9em 0 .4em}.plate-md h3{font-size:1.25em}
.plate-md code{font-family:"JetBrains Mono",monospace;font-size:.82em;color:#86ddec;background:color-mix(in srgb,var(--acc) 10%,transparent);border:1px solid color-mix(in srgb,var(--acc) 18%,transparent);border-radius:4px;padding:.06em .38em}
.plate-md pre{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;overflow-x:auto}
.plate-md pre code{background:none;border:none;padding:0;font-size:13px;color:#dde3ef}
.plate-md strong{color:#f3f6fc}.plate-md blockquote{border-left:3px solid var(--acc);margin-left:0;padding-left:18px;color:var(--ink-soft);font-style:italic}
.plate-md table{border-collapse:collapse}.plate-md th,.plate-md td{border-bottom:1px solid var(--rule);padding:6px 14px 6px 0;text-align:left}
.plate-md img{max-width:100%}
/* code plate */
.cellhead{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.cno{width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--bg);font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;display:grid;place-items:center;flex:none}
.ctag{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:1.8px;color:var(--ink-faint);text-transform:uppercase}
.ctag .ran{color:var(--green)}
.cfirst{font-family:"JetBrains Mono",monospace;font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate-code{background:var(--panel-2);border:1px solid var(--rule);border-left:3px solid var(--acc);border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.codebar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel-hi);border-bottom:1px solid var(--rule-soft)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots i:nth-child(1){background:#e0705a66}.dots i:nth-child(2){background:#f0c46a55}.dots i:nth-child(3){background:#5fd0a055}
.fname{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-mute);letter-spacing:.6px;flex:1}
.btn{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;border-radius:7px;padding:7px 13px;cursor:pointer;border:1px solid var(--rule);background:transparent;color:var(--ink-mute);transition:all .15s;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--ink-mute)}
.btn-run{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.btn-run:hover{color:var(--bg);filter:brightness(1.12);border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.CodeMirror{height:auto;background:transparent;font-family:"JetBrains Mono",monospace;font-size:13.5px;line-height:1.6;color:#dde3ef;padding:6px 4px}
.CodeMirror-gutters{background:transparent;border-right:1px solid var(--rule-soft)}
.CodeMirror-linenumber{color:var(--ink-faint);font-size:11px}
.CodeMirror-cursor{border-left:2px solid var(--acc)}
.CodeMirror-selected{background:color-mix(in srgb,var(--acc) 16%,transparent)!important}
.cm-s-obs .cm-keyword{color:#9b8cf0}.cm-s-obs .cm-number{color:#f0c46a}.cm-s-obs .cm-string{color:#5fd0a0}.cm-s-obs .cm-comment{color:#566079;font-style:italic}.cm-s-obs .cm-builtin{color:#7c9bf0}.cm-s-obs .cm-def{color:#5fd0e6}.cm-s-obs .cm-operator{color:#e06ad4}.cm-s-obs .cm-variable{color:#e9edf6}.cm-s-obs .cm-property{color:#86ddec}.cm-s-obs .cm-meta{color:#b39bf0}
/* output */
.out{border-top:1px dashed var(--rule);padding:14px 18px;display:none}
.out.has{display:block}
.olabel{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase;margin-bottom:8px}
.olabel .saved{color:var(--solar)}
.out pre{margin:0;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.55;color:var(--ink-soft);white-space:pre-wrap;overflow-x:auto}
.out pre.err{color:var(--coral)}
.out pre.res{color:#cde6f2}
.out img{max-width:100%;border-radius:8px;margin-top:8px;background:#fff}
/* foot note */
.note{margin-top:26px;border:1px dashed var(--rule);border-radius:12px;padding:16px 20px;font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.75;color:var(--ink-mute)}
.note kbd{background:var(--panel-hi);border:1px solid var(--rule);border-radius:5px;padding:1px 7px;font-size:10.5px;color:var(--ink-soft)}
.loading{padding:80px 0;text-align:center;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:2px;color:var(--ink-mute);text-transform:uppercase}
@media (max-width:720px){.hero h1{font-size:34px}.plate-md{padding:22px 20px}}
</style>
</head>
<body>

</div>

</body>
