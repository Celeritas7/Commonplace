<!DOCTYPE html>
<html lang="en" data-tag="projects">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ch 2 — End-to-End ML Project (flowchart)</title>
<style>
:root{--bg:#fbfaf7;--surface:#fff;--text:#23221f;--muted:#6b6a64;--border:#e7e4dc;--accent:#993556}
html[data-theme="dark"]{--bg:#1a1916;--surface:#23221f;--text:#ecebe6;--muted:#a3a199;--border:#3a3833}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;font-size:17px}
.wrap{max-width:1000px;margin:0 auto;padding:2rem 1.25rem 5rem}
h1{font-size:1.7rem;font-weight:650;margin:.2rem 0 .3rem}
.topbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1.2rem}
.chip{font-size:.78rem;font-weight:600;color:#fff;background:var(--accent);padding:.2rem .6rem;border-radius:999px}
.meta{font-size:.85rem;color:var(--muted)}.spacer{flex:1}
.btn{font:inherit;font-size:.85rem;cursor:pointer;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.35rem .7rem}
.btn:hover{border-color:var(--accent)}
.note{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:.7rem 1rem;margin:0 0 1.4rem;font-size:.92rem;color:var(--muted)}
.diagram{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;overflow:auto}
.mermaid{min-height:200px}
a{color:#185fa5}
footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="chip">#projects</span>
    <span class="meta">Hands-On ML · Chapter 2 · revision flowchart</span>
    <span class="spacer"></span>
    <button class="btn" id="reviewBtn">Mark reviewed</button>
    <button class="btn" id="themeBtn">◐ theme</button>
  </div>
  <h1>End-to-End Machine Learning Project</h1>
  <div class="note">The 8-step project pipeline. Use it as a checklist when you build Project 1 in the study plan — every real project walks this path.</div>
  <div class="diagram"><pre class="mermaid" id="graph"></pre></div>
  <footer><a href="../foundations/ch1-ml-landscape.html">← Chapter 1 — ML Landscape</a> · <a href="../index.html">all notes</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
const root=document.documentElement,$=s=>document.querySelector(s);
const NID='ch2-end-to-end-project';
const SRC=`flowchart LR
  R(["End-to-End Project — Ch 2"]):::root
  R --> P0["Work with real data"]:::ph
  R --> P1["1 · Look at the big picture"]:::ph
  P1 --> P1a["Frame the problem"]
  P1a --> P1a1["Pipelines"]
  P1 --> P1b["Select a performance measure"]
  P1b --> P1b1["Notations (RMSE, MAE)"]
  P1 --> P1c["Check the assumptions"]
  R --> P2["2 · Get the data"]:::ph
  P2 --> P2a["Create the workspace"]
  P2a --> P2a1["Isolated environment"]
  P2 --> P2b["Download the data"]
  P2 --> P2c["Quick look at structure"]
  P2 --> P2d["Create a test set"]
  R --> P3["3 · Explore & visualize"]:::ph
  P3 --> P3a["Geographical data"]
  P3 --> P3b["Looking for correlations"]
  P3 --> P3c["Attribute combinations"]
  R --> P4["4 · Prepare the data"]:::ph
  P4 --> P4a["Data cleaning"]
  P4a --> P4a1["Scikit-Learn design"]
  P4 --> P4b["Text & categorical attributes"]
  P4 --> P4c["Custom transformers"]
  P4 --> P4d["Feature scaling"]
  P4 --> P4e["Transformation pipelines"]
  R --> P5["5 · Select & train a model"]:::ph
  P5 --> P5a["Train & evaluate on training set"]
  P5 --> P5b["Cross-validation"]
  R --> P6["6 · Fine-tune the model"]:::ph
  P6 --> P6a["Grid search"]
  P6 --> P6b["Randomized search"]
  P6 --> P6c["Ensemble methods"]
  P6 --> P6d["Analyze best models & errors"]
  P6 --> P6e["Evaluate on the test set"]
  R --> P7["7 · Launch, monitor, maintain"]:::ph
  R --> P8["8 · Try it out / exercises"]:::ph
  classDef root fill:#993556,stroke:#72243e,color:#fff,font-weight:600;
  classDef ph fill:#fbeaf0,stroke:#d4537e,color:#72243e;`;
function renderMermaid(){const dark=root.getAttribute('data-theme')==='dark';
  mermaid.initialize({startOnLoad:false,theme:dark?'dark':'neutral',flowchart:{curve:'basis',nodeSpacing:24,rankSpacing:60}});
  const el=$('#graph');el.removeAttribute('data-processed');el.textContent=SRC;mermaid.run({nodes:[el]});}
if(localStorage.getItem('theme-'+NID)==='dark')root.setAttribute('data-theme','dark');
$('#themeBtn').onclick=()=>{const d=root.getAttribute('data-theme')==='dark';root.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('theme-'+NID,d?'light':'dark');renderMermaid();};
const rb=$('#reviewBtn');function rr(){const t=localStorage.getItem('reviewed-'+NID);rb.textContent=t?('Reviewed '+t):'Mark reviewed';}
rb.onclick=()=>{localStorage.setItem('reviewed-'+NID,new Date().toISOString().slice(0,10));rr();};rr();
renderMermaid();
</script>
</body>
</html>
