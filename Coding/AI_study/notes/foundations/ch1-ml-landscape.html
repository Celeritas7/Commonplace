<!DOCTYPE html>
<html lang="en" data-tag="foundations">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ch 1 — The ML Landscape (flowchart)</title>
<style>
:root{--bg:#fbfaf7;--surface:#fff;--text:#23221f;--muted:#6b6a64;--border:#e7e4dc;--accent:#5f5e5a}
html[data-theme="dark"]{--bg:#1a1916;--surface:#23221f;--text:#ecebe6;--muted:#a3a199;--border:#3a3833}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;font-size:17px}
.wrap{max-width:1000px;margin:0 auto;padding:2rem 1.25rem 5rem}
h1{font-size:1.7rem;font-weight:650;margin:.2rem 0 .3rem}
.topbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1.2rem}
.chip{font-size:.78rem;font-weight:600;color:#fff;background:var(--accent);padding:.2rem .6rem;border-radius:999px}
.meta{font-size:.85rem;color:var(--muted)}.spacer{flex:1}
.btn{font:inherit;font-size:.85rem;cursor:pointer;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.35rem .7rem}
.btn:hover{border-color:var(--accent)}
.note{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:.7rem 1rem;margin:0 0 1.4rem;font-size:.92rem;color:var(--muted)}
.diagram{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;overflow:auto}
.mermaid{min-height:200px}
a{color:#185fa5}
footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="chip">#foundations</span>
    <span class="meta">Hands-On ML · Chapter 1 · revision flowchart</span>
    <span class="spacer"></span>
    <button class="btn" id="reviewBtn">Mark reviewed</button>
    <button class="btn" id="themeBtn">◐ theme</button>
  </div>
  <h1>The Machine Learning Landscape</h1>
  <div class="note">Revision map. Scan the four branches and try to recall each leaf before reading it. Last reviewed date is tracked by the button above.</div>
  <div class="diagram"><pre class="mermaid" id="graph"></pre></div>
  <footer>Next: <a href="../projects/ch2-end-to-end-project.html">Chapter 2 — End-to-End Project →</a> · <a href="../index.html">all notes</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
const root=document.documentElement,$=s=>document.querySelector(s);
const NID='ch1-ml-landscape';
const SRC=`flowchart LR
  R(["ML Landscape — Ch 1"]):::root
  R --> A["ML Definition & Use"]:::b1
  A --> A1["Task T, Experience E, Performance P"]
  A --> A2["Why use ML — spam filter example"]
  R --> B["Types of ML Systems"]:::b2
  B --> BL["Learning Types"]
  BL --> BL1["Supervised — regression, classification"]
  BL --> BL2["Unsupervised — clustering, dim. reduction, anomaly"]
  BL --> BL3["Semi-supervised"]
  BL --> BL4["Reinforcement (RL)"]
  B --> BD["Data Handling"]
  BD --> BD1["Batch (offline)"]
  BD --> BD2["Online — incremental, out-of-core"]
  B --> BG["Generalization"]
  BG --> BG1["Instance-based — similarity, k-NN"]
  BG --> BG2["Model-based — model selection, training"]
  R --> C["Main Challenges"]:::b3
  C --> C1["Insufficient training data"]
  C --> C2["Nonrepresentative data — sampling bias"]
  C --> C3["Poor-quality data — outliers, errors"]
  C --> C4["Irrelevant features — feature engineering"]
  C --> C5["Overfitting — high variance"]
  C --> C6["Underfitting — high bias"]
  R --> D["Testing & Validation"]:::b4
  D --> D1["Test set — generalization error"]
  D --> D2["Validation set — hyperparameter tuning"]
  D --> D3["Cross-validation"]
  D --> D4["Data snooping bias"]
  D --> D5["Data mismatch — train-dev set"]
  classDef root fill:#534ab7,stroke:#3c3489,color:#fff,font-weight:600;
  classDef b1 fill:#e6f1fb,stroke:#378add,color:#0c447c;
  classDef b2 fill:#e1f5ee,stroke:#1d9e75,color:#085041;
  classDef b3 fill:#faece7,stroke:#d85a30,color:#712b13;
  classDef b4 fill:#faeeda,stroke:#ba7517,color:#633806;`;
function renderMermaid(){const dark=root.getAttribute('data-theme')==='dark';
  mermaid.initialize({startOnLoad:false,theme:dark?'dark':'neutral',flowchart:{curve:'basis',nodeSpacing:26,rankSpacing:55}});
  const el=$('#graph');el.removeAttribute('data-processed');el.textContent=SRC;mermaid.run({nodes:[el]});}
if(localStorage.getItem('theme-'+NID)==='dark')root.setAttribute('data-theme','dark');
$('#themeBtn').onclick=()=>{const d=root.getAttribute('data-theme')==='dark';root.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('theme-'+NID,d?'light':'dark');renderMermaid();};
const rb=$('#reviewBtn');function rr(){const t=localStorage.getItem('reviewed-'+NID);rb.textContent=t?('Reviewed '+t):'Mark reviewed';}
rb.onclick=()=>{localStorage.setItem('reviewed-'+NID,new Date().toISOString().slice(0,10));rr();};rr();
renderMermaid();
</script>
</body>
</html>
