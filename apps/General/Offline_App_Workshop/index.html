<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline App Workshop</title>
<link rel="stylesheet" href="css/course.css">
</head>
<body>
<header class="top">
  <button id="btnMenu" class="btn ghost menu" aria-label="Show lessons">&#9776;</button>
  <div class="crumb"><a href="#/">Offline App Workshop</a></div>
  <div class="tools">
    <button id="btnTheme" class="btn ghost" title="Light / dark">&#9680;</button>
  </div>
</header>

<div class="layout">
  <aside id="side">
    <div class="progress"><div class="bar"><span id="overall"></span></div><div id="overallTxt" class="muted"></div></div>
    <nav id="nav"></nav>
    <div class="backup">
      <div class="muted">Progress is saved in this browser only.</div>
      <button id="btnExport" class="btn">Export backup</button>
      <button id="btnImport" class="btn">Import&hellip;</button>
      <input type="file" id="fileImport" accept=".json" hidden>
    </div>
  </aside>
  <main id="main"></main>
</div>

<!-- Plain script tags, in order. No fetch(), so this works when opened straight from disk. -->
<script src="js/course.js"></script>
<script src="js/lessons/intro.js"></script>
<script src="js/lessons/m1-what-offline-means.js"></script>
<script src="js/lessons/m2-one-file-app.js"></script>
<script src="js/lessons/m3-styling.js"></script>
<script src="js/lessons/m4-javascript.js"></script>
<script src="js/lessons/m5-saving-data.js"></script>
<script src="js/lessons/planned.js"></script>
</body>
</html>
