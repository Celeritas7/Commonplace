<!-- @dsCard group="Commonplace Maths" viewport="1100x820" name="Maths click-through" subtitle="Hub → A1 note (paper/clean, day/night) → Statistics worksheet" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mathematics · Commonplace — UI kit</title>
<link rel="stylesheet" href="lib/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>try{var d=document.documentElement;if(localStorage.getItem("cp-maths:style")==="clean")d.setAttribute("data-style","clean");if(localStorage.getItem("cp-maths:theme")==="night")d.setAttribute("data-theme","night");}catch(e){}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="lib/_ds_bundle.js"></script>
<style>body{margin:0}.katex{font-size:1.04em}.katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}h3{font-family:var(--font-display)}html[data-style="clean"] h1,html[data-style="clean"] h2,html[data-style="clean"] h3{font-family:var(--font-sans)!important}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Maths.jsx"></script>
<script type="text/babel" src="HubScreen.jsx"></script>
<script type="text/babel" src="NoteScreen.jsx"></script>
<script type="text/babel" src="WorksheetScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [screen,setScreen]=React.useState(()=>localStorage.getItem('cp-kit:screen')||'hub');
  const [st,setSt]=React.useState(()=>localStorage.getItem('cp-maths:style')==='clean'?'clean':'paper');
  const [th,setTh]=React.useState(()=>localStorage.getItem('cp-maths:theme')==='night'?'night':'day');
  const go=s=>{setScreen(s);try{localStorage.setItem('cp-kit:screen',s);}catch(e){} window.scrollTo(0,0);};
  React.useEffect(()=>{const d=document.documentElement;const onNote=screen==='note';
    if(onNote&&st==='clean')d.setAttribute('data-style','clean');else d.removeAttribute('data-style');
    if(onNote&&th==='night')d.setAttribute('data-theme','night');else d.removeAttribute('data-theme');},[screen,st,th]);
  const toggleStyle=()=>{const v=st==='clean'?'paper':'clean';setSt(v);localStorage.setItem('cp-maths:style',v);};
  const toggleTheme=()=>{const v=th==='night'?'day':'night';setTh(v);localStorage.setItem('cp-maths:theme',v);};
  if(screen==='note')return <NoteScreen go={go} style={st} theme={th} toggleStyle={toggleStyle} toggleTheme={toggleTheme}/>;
  if(screen==='worksheet')return <WorksheetScreen go={go}/>;
  return <HubScreen go={go}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
