# Generated from Supabase CLI 3.3.0 init; reduced for disposable local acceptance.
# This is NOT a hosted deployment config. Do not config-push it to a real project.
project_id = "commonplace-local-acceptance"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[db.pooler]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = true
file_size_limit = "10MiB"
[storage.s3_protocol]
enabled = false
[storage.vector]
enabled = false
[storage.analytics]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = []
# Disposable local fixtures exercise the reviewed signup trigger. No emails leave
# this loopback-only stack. Hosted Auth settings must never use this config.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enabled = true
enable_confirmations = false
[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2
[analytics]
enabled = false
[functions.material-files]
verify_jwt = true
import_map = "./functions/material-files/deno.json"
[functions.offline-lease]
verify_jwt = true
import_map = "./functions/material-files/deno.json"
