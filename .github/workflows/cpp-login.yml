name: C++ login return regression
on:
  push:
    paths: ['Coding/c_and_cpp_study/**', '_lib/gate.js', '_lib/supabase.js', '.github/workflows/cpp-login.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/cpp-login-tests playwright@1.56.1
          /tmp/cpp-login-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node Coding/c_and_cpp_study/tests/login-return.cjs
        env:
          NODE_PATH: /tmp/cpp-login-tests/node_modules
      - run: node tests/gate-login.cjs
        env:
          NODE_PATH: /tmp/cpp-login-tests/node_modules
      - name: Offline Chromium acceptance
        run: |
          export CHROMIUM_PATH=$(node -p "require('/tmp/cpp-login-tests/node_modules/playwright').chromium.executablePath()")
          node Coding/c_and_cpp_study/tests/offline-browser.cjs
        env:
          NODE_PATH: /tmp/cpp-login-tests/node_modules
  # Optional diagnostic: desktop WebKit CacheStorage behavior needs investigation.
  webkit-offline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/cpp-login-tests playwright@1.56.1
          /tmp/cpp-login-tests/node_modules/.bin/playwright install webkit
      - name: Offline WebKit acceptance
        run: node Coding/c_and_cpp_study/tests/offline-browser.cjs
        env:
          NODE_PATH: /tmp/cpp-login-tests/node_modules
          BROWSER: webkit
