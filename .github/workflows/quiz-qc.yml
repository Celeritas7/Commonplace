name: Quiz quality checks
on:
  push:
    paths:
      - '_lib/quiz/quiz.js'
      - '_lib/autoscroll.js'
      - 'Coding/Python/lib/lesson-reader.js'
      - 'tests/quiz-routing.cjs'
      - '.github/workflows/quiz-qc.yml'
  pull_request:
    paths:
      - '_lib/quiz/quiz.js'
      - '_lib/autoscroll.js'
      - 'Coding/Python/lib/lesson-reader.js'
      - 'tests/quiz-routing.cjs'
      - '.github/workflows/quiz-qc.yml'
jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/quiz-routing.cjs
      - run: node --check _lib/quiz/quiz.js && node --check _lib/autoscroll.js && node --check Coding/Python/lib/lesson-reader.js
