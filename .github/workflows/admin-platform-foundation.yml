name: Admin platform foundation
on:
  pull_request:
    paths: ['platform/**', 'docs/admin-platform/**', 'Office_work/Excel_study/**', '.github/workflows/admin-platform-foundation.yml']
  push:
    branches: [main]
    paths: ['platform/**', 'docs/admin-platform/**', 'Office_work/Excel_study/**', '.github/workflows/admin-platform-foundation.yml']
permissions:
  contents: read
jobs:
  isolated-security-tests:
    # Match the OS supported by the pinned Playwright browser/dependency bundle.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: platform
      - run: npm test
        working-directory: platform
      - run: node tools/build-offline-shell.mjs --check
        working-directory: platform
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      # Use npm ci's locked packages for the server's second runtime too.
      - run: deno check --node-modules-dir=manual --config supabase/functions/material-files/deno.json supabase/functions/material-files/index.ts
        working-directory: platform
      - run: deno check --node-modules-dir=manual --config supabase/functions/material-files/deno.json supabase/functions/offline-lease/index.ts
        working-directory: platform
      - run: deno test --no-check --allow-read --node-modules-dir=manual --config supabase/functions/material-files/deno.json tests/material-files.test.mjs
        working-directory: platform
      - run: deno test --no-check --allow-read --node-modules-dir=manual --config supabase/functions/material-files/deno.json tests/offline.test.mjs
        working-directory: platform
      - run: npx playwright install --with-deps chromium
        working-directory: platform
      - run: npm run test:browser
        working-directory: platform
