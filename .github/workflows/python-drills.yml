name: Python drill feedback
on:
  pull_request:
    paths: ['Coding/Python/lib/lesson-drills.js', 'Coding/Python/lib/random/fd.js', 'Coding/Python/lib/drills/**', 'Coding/Python/tests/drill-feedback.cjs', '.github/workflows/python-drills.yml']
  push:
    paths: ['Coding/Python/lib/lesson-drills.js', 'Coding/Python/lib/random/fd.js', 'Coding/Python/lib/drills/**', 'Coding/Python/tests/drill-feedback.cjs', '.github/workflows/python-drills.yml']
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/python-drill-tests playwright@1.56.1
          /tmp/python-drill-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node Coding/Python/tests/drill-feedback.cjs
        env:
          NODE_PATH: /tmp/python-drill-tests/node_modules
